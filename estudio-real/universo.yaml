  # RevenuesNetOfInterestExpense en todos (misma cifra), así que se fija esta última para tener los
  # trimestres. Gasto financiero: «Total interest expense», etiquetado InterestExpense hasta 2023 e
  # InterestExpenseOperating desde entonces (cambio de la taxonomía).
