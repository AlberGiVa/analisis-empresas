# Universo del estudio con datos reales: grandes empresas de Europa y EE. UU.
#
# Por qué este grupo: empezó con diez emisores grandes de consumo básico que tienen a la vez
# acciones cotizadas y deuda corporativa en el mercado, que es exactamente lo que el fondo analiza
# desde las dos vistas. Son comparables entre sí (mismo sector y negocio maduro) y publican sus
# cuentas en la SEC con la fecha exacta de cada informe, lo que permite una lectura a fecha
# estricta. Incluyen calendarios fiscales distintos (cierre en mayo, junio, diciembre y años de
# 52/53 semanas) para probar la herramienta.
#
# Identificadores verificados el 20/10/2026: ISIN con OpenFIGI, LEI con GLEIF (Kraft Heinz, por
# nombre: GLEIF no le asocia el ISIN), CIK y mercado con la SEC y Yahoo Finance.
#
# Deuda: cada empresa presenta su deuda en líneas distintas del balance. Para cada una se listan las
# líneas que la componen y, entre corchetes, las etiquetas XBRL con que aparecen (alternativas: la
# misma línea puede llevar otra etiqueta en algún informe). Se han revisado comprobando que las
# líneas suman sin duplicar (por ejemplo, el papel comercial ya está dentro de la deuda a corto de
# PepsiCo) y que la serie es continua trimestre a trimestre. Los arrendamientos solo se incluyen
# cuando la empresa los presenta dentro de su deuda.
#
# Ampliación del 21/10/2026: tres eléctricas, dos bancos y dos aseguradoras, para comparar
# negocios con estructuras financieras muy distintas y ver con datos reales los casos que la
# herramienta trata aparte (en bancos y aseguradoras, las métricas de EBITDA, deuda neta o EV «no
# aplican»). Cada una lleva delante el porqué de sus líneas de deuda y de cualquier etiqueta fijada.
# `tags: {ebit: []}` deja sin resultado operativo a una empresa que usa OperatingIncomeLoss para
# una medida ajustada que no es un resultado operativo (MetLife y Travelers): sin dato, con motivo.
#
# Segunda ampliación del 21/10/2026: cuatro tecnológicas, cuatro industriales, cuatro de salud y
# tres de energía, hasta 32 empresas de siete sectores. Muchas grandes empresas de estos sectores no
# publican un resultado operativo (su cuenta de resultados pasa de los gastos al resultado antes de
# impuestos), así que no tendrían EBIT ni EBITDA comparables: se han sustituido por otras del mismo
# negocio que sí lo publican. `depreciation:` fija las etiquetas de amortizaciones que se suman para
# el EBITDA cuando la habitual se queda corta (Cisco). Los sectores con menos de cinco empresas se
# comparan con todo el universo (`min_peers` de la metodología).
#
# Tercera ampliación del 21/10/2026: Europa y el sector de los EPI. Las europeas no están en la SEC:
# sus cuentas salen de su informe financiero anual oficial en XBRL (formato ESEF, normas NIIF), que
# recoge filings.xbrl.org (`source: esef`; decisión 0019). Solo hay informes anuales, así que sus
# doce últimos meses son su último ejercicio, y no hay cotizaciones europeas de uso libre. En sus
# etiquetas, una sin prefijo es de las NIIF (`ifrs-full`) y las de la propia empresa llevan el suyo
# (`ibe:…`); una etiqueta fijada con «-» delante se lee con el signo cambiado. Deuda: préstamos,
# bonos y pagarés; ni derivados ni arrendamientos, salvo que la empresa los presente dentro de su
# deuda (cada empresa lo dice). Los fabricantes de equipos de protección individual (industria
# `personal_protection`) se comparan en su propia página de la web. La revisión completa de cada
# grupo, con las empresas descartadas y por qué, está en `estudio-real/candidatas/`
# (europa-*.yaml y epi.yaml).
#
# Excluidas tras revisar sus datos:
# - Hershey: dos clases de acciones; los datos estructurados solo dan una y la capitalización
#   saldría mal. Por lo mismo, Regeneron. Vertex no tiene bonos.
# - No publican resultado operativo: Clorox, IBM, Johnson & Johnson, Pfizer, Merck & Co., Eli
#   Lilly, Bristol-Myers Squibb, Zoetis, Biogen, Exxon Mobil, Chevron, ConocoPhillips, Occidental,
#   Phillips 66 y Devon; Deere, desde el ejercicio 2025. Exxon, además, cotiza desde julio de 2026 a
#   través de una sociedad holding nueva con otro CIK y casi sin historia en los datos estructurados.
# - Caterpillar: sus balances trimestrales separan Maquinaria y Productos Financieros, y en los
#   datos estructurados solo aparece la deuda consolidada al cierre del año, sin los vencimientos a
#   un año ni el gasto financiero: no habría vista de acreedor.
# - Honeywell: contrasplit de 1 por 2 el 29/06/2026 sin la cifra de acciones nueva hasta el
#   23/07/2026 (la capitalización a 30/06/2026 saldría el doble); además, en plena separación en
#   varias empresas y con un gasto financiero sin doce meses de dato.
# - Union Pacific: solo publica «Depreciation» (sin amortización de intangibles), que el estudio no
#   acepta sola como amortizaciones: no habría EBITDA.
# - Gilead: etiqueta la amortización de intangibles de los trimestres con una etiqueta que la
#   herramienta no lee: solo habría EBITDA de ejercicios completos, no de los doce últimos meses.
# - EOG y Diamondback reparten sus inversiones en varias líneas sin dar el total (no habría flujo de
#   caja libre); Valero deja de etiquetar sus inversiones con una etiqueta estándar desde el cuarto
#   trimestre de 2025.
# - Europa: TotalEnergies (no publica resultado operativo), Enel (sin el informe de 2025), Banco
#   Santander (su deuda emitida solo aparece desglosada) y Novo Nordisk (pendiente de revisar).
# - EPI: Avon Technologies (no etiqueta amortizaciones, gasto financiero ni acciones) y Alpha Pro
#   Tech (sin deuda financiera). Dräger, Ansell y Delta Plus no tienen cuentas de uso libre.

name: "Grandes empresas de Europa y EE. UU."
description: >-
  58 grandes empresas de Europa (23) y EE. UU. (35) de consumo,
  tecnología, industria, salud, energía, eléctricas, telecomunicaciones, banca y seguros, y los
  fabricantes cotizados de equipos de protección individual. Cuentas de los informes anuales
  oficiales de las europeas y de la SEC (sin ajustes), cotizaciones de cierre diarias de las de
  EE. UU. y tipos de cambio del BCE.
