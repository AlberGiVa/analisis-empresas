# Universo del estudio con datos reales: consumo básico de EE. UU.
#
# Por qué este grupo: diez emisores grandes que tienen a la vez acciones cotizadas y deuda
# corporativa en el mercado, que es exactamente lo que el fondo analiza desde las dos vistas. Son
# comparables entre sí (mismo sector y negocio maduro) y publican sus cuentas en la SEC con la fecha
# exacta de cada informe, lo que permite una lectura a fecha estricta. Incluyen calendarios fiscales
# distintos (cierre en mayo, junio, diciembre y años de 52/53 semanas) para probar la herramienta.
#
# Identificadores verificados el 20/10/2026: ISIN con OpenFIGI, LEI con GLEIF (Kraft Heinz, por
# nombre: GLEIF no le asocia el ISIN), CIK y mercado con la SEC y Yahoo Finance.
#
# Deuda: cada empresa presenta su deuda en líneas distintas del balance. Para cada una se listan las
# líneas que la componen y, entre corchetes, las etiquetas XBRL con que aparecen (alternativas: la
# misma línea puede llevar otra etiqueta en algún informe). Se han revisado comprobando que las
# líneas suman sin duplicar (por ejemplo, el papel comercial ya está dentro de la deuda a corto de
# PepsiCo) y que la serie es continua trimestre a trimestre. Los arrendamientos solo se incluyen
# cuando la empresa los presenta dentro de su deuda.
#
# Excluidas tras revisar sus datos: Hershey (dos clases de acciones: los datos estructurados solo
# dan una y la capitalización saldría mal) y Clorox (no publica resultado operativo, así que no hay
# EBIT ni EBITDA comparables).

name: "Consumo básico de EE. UU."
description: >-
  Diez fabricantes de alimentación, bebidas y productos de hogar e higiene de EE. UU. con acciones
  y bonos en el mercado. Cuentas de la SEC (normas contables de EE. UU., sin ajustes), cotizaciones
  de cierre diarias y tipos de cambio del BCE.
history_start: 2023-01-01

