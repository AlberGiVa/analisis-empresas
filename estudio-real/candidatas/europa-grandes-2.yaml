  # --- Fragmento: grandes europeas, grupo 2 (informes anuales ESEF de filings.xbrl.org) ----------
  #
  # Estado (21/10/2026): comprobadas con apoyo/comprobar_empresas.py las 4 empresas que quedan (ENI,
  # VER, HEIA, AZN); pendiente de incorporarlas a universo.yaml. De las cuatro del encargo solo sirve
  # Heineken: las otras tres se sustituyen por otra gran cotizada del mismo negocio (ver excluidas).
  #
  # Identificadores verificados el 21/10/2026: LEI con GLEIF (razón social, jurisdicción y registro
  # en vigor) y con el índice de entidades de filings.xbrl.org; ISIN con su dígito de control y con
  # OpenFIGI, que también da el mercado principal. Cifras contrastadas con la nota de deuda del propio
  # informe y con la nota de prensa de resultados de cada empresa.
  #
  # Las cuatro se leen del informe anual de 2025 (los doce últimos meses son el último ejercicio).
  # Ninguna publica el número de acciones en circulación como dato sin desglose, así que esa partida
  # queda sin dato (sin cotizaciones europeas, las métricas de mercado quedan sin dato de todos modos).
  #
  # Excluidas tras revisar sus datos (texto para la cabecera del universo):
  # - TotalEnergies: no publica resultado operativo (su cuenta de resultados pasa de los gastos al
  #   resultado sin ese subtotal), así que no hay EBIT ni EBITDA, como Exxon Mobil o Chevron; además
  #   etiqueta con etiquetas propias el gasto financiero y las inversiones. La sustituye Eni (petrolera
  #   integrada, Italia), que sí publica resultado operativo.
  # - Enel: su último informe anual en filings.xbrl.org es el de 2024 (el de 2025 no está a
  #   21/10/2026), y sin informe del último ejercicio no sirve. La sustituye VERBUND (eléctrica,
  #   Austria). Se descartó ENGIE: no publica las amortizaciones solas (solo «amortizaciones y
  #   provisiones», con etiqueta propia), así que el EBITDA mezclaría provisiones, y sus inversiones
  #   solo llevan etiqueta propia.
  # - Novo Nordisk: publica también sus informes trimestrales en ESEF y, cuando se revisó, la descarga
  #   cogía esos y no el anual. Ya está corregido (solo se descargan informes anuales), pero su deuda
  #   y sus etiquetas no se han revisado: queda para otra ampliación. La sustituye AstraZeneca
  #   (farmacéutica, Reino Unido).

  # --- Energía ------------------------------------------------------------------------------------
  # Sustituye a TotalEnergies. Deuda = las tres líneas del balance: deuda a corto, vencimientos a un
  # año de la deuda a largo y deuda a largo (bancos, bonos, bonos convertibles y otros financiadores;
  # 28.502 M a cierre de 2025, como en la nota de pasivos financieros). Los arrendamientos (5.700 M)
  # van en líneas aparte y no se incluyen; los bonos híbridos perpetuos son patrimonio según las NIIF.
  # Gasto financiero fijado: los «gastos financieros» (8.170 M) son brutos e incluyen las diferencias
  # de cambio negativas, que los ingresos financieros (7.196 M) compensan casi del todo (el neto es de
  # 819 M), así que no son el coste de la deuda; se usan los intereses del estado de flujos (1.256 M;
  # en la nota: bonos 774 + bancos y otros 252 + arrendamientos 348 − intereses activados 122). Las
  # amortizaciones del EBITDA no incluyen los deterioros (1.582 M en 2025), que sí restan en el
  # resultado operativo. La deuda neta del estudio solo resta la caja: la de Eni resta además los
  # títulos de negociación (6.991 M) y suma los arrendamientos.
  - id: ENI
    name: Eni S.p.A.
    source: esef
    ticker: ENI
    isin: IT0003132476
    lei: BUCRF72VH5RBN7X3VL35
    exchange: XMIL
    country: IT
    sector: energy
    industry: oil_gas
    currency: EUR
    fiscal_year_end_month: 12
    debt:
      - {line: "Deuda a corto plazo", tags: [ShorttermBorrowings]}
      - {line: "Vencimientos a un año de la deuda a largo", tags: [CurrentPortionOfLongtermBorrowings]}
      - {line: "Deuda a largo plazo", tags: [LongtermBorrowings], required: true}
    tags:
      interest_expense: [AdjustmentsForInterestExpense]

  # --- Eléctricas ---------------------------------------------------------------------------------
  # Sustituye a Enel (la República de Austria tiene el 51 %). Deuda = pasivos financieros a largo y
  # a corto del balance (2.272,8 M a cierre de 2025): bonos, préstamos de bancos y de otros,
  # participaciones de socios comanditarios (13 M) y 333 M de préstamos de antiguas operaciones de
  # arrendamiento transfronterizo que la empresa presenta «cerradas» (compensadas por inversiones del
  # mismo importe en el activo): van dentro de la línea y no se pueden separar. Los arrendamientos
  # (187 M) van en otros pasivos y no se incluyen. Inversiones = inmovilizado material e intangibles
  # juntos (no publica las de material por separado). Amortizaciones sin deterioros: el EBITDA de
  # 2025 (2.737,3 M) coincide con el publicado (2.737,5 M); el de 2024 sale 176 M por debajo del
  # publicado porque el resultado operativo resta los deterioros netos de ese año.
  - id: VER
    name: VERBUND AG
    source: esef
    ticker: VER
    isin: AT0000746409
    lei: 5299006UDSEJCTTEJS30
    exchange: XWBO
    country: AT
    sector: utilities
    industry: electric_utilities
    currency: EUR
    fiscal_year_end_month: 12
    debt:
      - {line: "Pasivos financieros a corto", tags: [CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings]}
      - {line: "Pasivos financieros a largo", tags: [LongtermBorrowings], required: true}

  # --- Alimentación y bebidas ---------------------------------------------------------------------
  # Heineken N.V. (la cotizada que consolida el negocio, no Heineken Holding). Ventas fijadas en los
  # ingresos netos de impuestos especiales sobre la cerveza («Net revenue», 28.753 M en 2025, línea de
  # su cuenta de resultados con etiqueta propia): la empresa calcula sus márgenes sobre ellos y así se
  # compara con las cerveceras y refresqueras de EE. UU. «Revenue» (34.257 M) incluye esos impuestos
  # (5.504 M), que la empresa recauda para Hacienda. Deuda = las
