# Candidatas para universo.yaml: eléctricas, bancos y aseguradoras de EE. UU. (fragmento).
#
# Estado a 20/10/2026:
# - Verificadas (7 de 7): NEE, DUK, SO, JPM, BAC, MET, TRV. Identificadores comprobados con la SEC,
#   OpenFIGI y GLEIF; líneas de deuda revisadas en los últimos balances; comprobador con el
#   proveedor real sin más avisos que los propios de los datos.
# - Pendientes: ninguna. Sin sustituciones.
# - Pendiente fuera del fragmento (código): el proveedor toma como corrección las cifras de los
#   DEF 14A (retribución), y cambia el beneficio neto de 2025 de JPM (57.048 → 57.000) y de MET
#   (3.379 → 3.173). Y `ebit: []` (MET, TRV) es un uso nuevo de `tags` que hay que aceptar.

# --- Eléctricas -------------------------------------------------------------------------------
# NextEra Energy: LEI de la matriz (NextEra Energy, Inc., Florida), el que GLEIF asocia a este
# ISIN; no confundir con el de su filial NextEra Energy Capital Holdings. Ingresos: el total de su
# cuenta de resultados («Operating revenues») va en RegulatedAndUnregulatedOperatingRevenue; la
# etiqueta por defecto (ingresos de contratos con clientes) es un desglose redondeado de una nota.
# Gasto financiero e inversiones en inmovilizado: los publica con etiquetas propias de la empresa
# (nee:InterestExpenseAggregateExpenses, nee:CapitalExpendituresOfFPL…), que la SEC no incluye en
# sus datos estructurados; faltan con su motivo y no se sustituyen por otra partida.
- id: NEE
  name: NextEra Energy, Inc.
  cik: "0000753308"
  ticker: NEE
  isin: US65339F1012
  lei: 254900RHL9MEUS5NKX63
  exchange: XNYS
  country: US
  sector: utilities
  industry: electric_utilities
  currency: USD
  fiscal_year_end_month: 12
  debt:
    - {line: "Papel comercial", tags: [CommercialPaper]}
    - {line: "Otra deuda a corto plazo", tags: [OtherShortTermBorrowings]}
    - {line: "Vencimientos a un año de la deuda a largo", tags: [LongTermDebtCurrent]}
    - {line: "Deuda a largo plazo", tags: [LongTermDebtNoncurrent], required: true}
  tags:
    revenue: [RegulatedAndUnregulatedOperatingRevenue]

