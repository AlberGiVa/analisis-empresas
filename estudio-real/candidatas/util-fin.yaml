# --- Seguros ----------------------------------------------------------------------------------
# MetLife: aseguradora, sin resultado operativo en su cuenta de resultados. Desde 2024 etiqueta
# OperatingIncomeLoss, pero es su «adjusted earnings» de la nota de segmentos (beneficio ajustado,
# después de impuestos y fuera de las normas contables), no un resultado operativo: la lista vacía
# deja el EBIT como «no publica esta partida», igual que en las demás aseguradoras y bancos.
# Deuda: las cuatro líneas de deuda de su balance (a corto, a largo, el acuerdo de financiación con
# garantía y la deuda subordinada, que hasta 2024 se llamaba «junior subordinated»). Fuera, los
# pagarés de las entidades de financiación con garantía consolidadas (sin recurso a MetLife) y los
# saldos con asegurados.
- id: MET
  name: MetLife, Inc.
  cik: "0001099219"
  ticker: MET
  isin: US59156R1086
  lei: C4BXATY60WC6XEOZDX54
  exchange: XNYS
  country: US
  sector: financials
  industry: insurance
  currency: USD
  fiscal_year_end_month: 12
  debt:
    - {line: "Deuda a corto plazo", tags: [ShortTermBorrowings]}
    - {line: "Deuda a largo plazo", tags: [LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities], required: true}
    - {line: "Acuerdo de financiación con garantía", tags: [SecuredDebt]}
    - {line: "Deuda subordinada", tags: [SubordinatedDebt, JuniorSubordinatedNotes]}
