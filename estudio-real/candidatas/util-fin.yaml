# --- Bancos -----------------------------------------------------------------------------------
# JPMorgan Chase: banco, sin resultado operativo (EBIT y EBITDA «no publica esta partida», como se
# espera; ver la decisión 0008). Ingresos: su total publicado es el «Total net revenue» (ingresos
# netos de intereses pagados). Lo etiqueta como Revenues solo en los informes anuales y como
# RevenuesNetOfInterestExpense en todos (misma cifra), así que se fija esta última para tener los
# trimestres. Gasto financiero: «Total interest expense», etiquetado InterestExpense hasta 2023 e
# InterestExpenseOperating desde entonces (cambio de la taxonomía).
# Deuda: préstamos a corto y deuda a largo del balance; no son deuda financiera los depósitos, las
# cesiones temporales (repos), los pasivos de negociación ni los títulos emitidos por vehículos
# consolidados (VIE), que el balance presenta aparte.
- id: JPM
  name: JPMorgan Chase & Co.
  cik: "0000019617"
  ticker: JPM
  isin: US46625H1005
  lei: 8I5DZWZKVSZI1NUHU748
  exchange: XNYS
  country: US
  sector: financials
  industry: banks
  currency: USD
  fiscal_year_end_month: 12
  debt:
    - {line: "Préstamos a corto plazo", tags: [ShortTermBorrowings]}
    - {line: "Deuda a largo plazo", tags: [LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities], required: true}
  tags:
    revenue: [RevenuesNetOfInterestExpense]
    interest_expense: [InterestExpenseOperating]

