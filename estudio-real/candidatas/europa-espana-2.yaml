  # --- Fragmento: España y Países Bajos (ESEF, no financieras) ---------------------------------------
  #
  # Identificadores verificados el 21/10/2026: LEI con GLEIF (razón social, jurisdicción y relación
  # ISIN-LEI) y con el índice de entidades de filings.xbrl.org; ISIN con su dígito de control y con
  # OpenFIGI (acción ordinaria en la bolsa de Madrid); mercado con OpenFIGI.
  #
  # Estado (21/10/2026): comprobadas las 5 con apoyo/comprobar_empresas.py, ya con la corrección de
  # las amortizaciones, la descarga solo de informes anuales y la suma de etiquetas fijadas («A+B»).
  # Todas tienen en filings.xbrl.org el informe anual de 2025 (presentados entre el 25/02 y el
  # 27/02/2026). Cifras de 2025 contrastadas con el propio informe (cuenta de resultados, balance,
  # nota de deuda y conciliación de la deuda neta): ventas, resultado operativo, beneficio atribuido
  # y deuda coinciden; el EBITDA calculado coincide con el que publican Aena (3.785,0 M), Amadeus
  # (2.493,4 M) y Grifols (1.693 M).
  #
  # Común a las cinco: ningún informe publica el número de acciones en los datos estructurados, así
  # que las acciones (y con ellas la capitalización) salen «la empresa no publica esta partida»,
  # como en Iberdrola. Ninguna publica beneficio bruto salvo Grifols.
  #
  # Excluida tras revisar sus datos (texto para la cabecera del universo):
  # - ACS: no publica resultado operativo. Su cuenta de resultados consolidada pasa de las partidas
  #   de explotación a los ingresos y gastos financieros sin subtotal de «resultado de explotación»
  #   (y el informe ESEF no lo etiqueta), así que no hay EBIT ni EBITDA, como en Clorox o IBM. La
  #   sustituye Acciona (construcción e infraestructuras, además de energía).
  #
  # Capex: Aena, Amadeus, Grifols y Ferrovial presentan su inversión en varias líneas del estado de
  # flujos (inmovilizado material, intangibles…); se fija su suma («A+B») y cada comentario dice con
  # qué cifra publicada coincide. Acciona ya publica una sola línea conjunta.

