# Estado (21/10/2026): comprobadas las 7 empresas (ABT, ABBV, AMGN, SYK, MPC, EQT, KMI) con
# comprobar_empresas.py e incorporadas a universo.yaml; pendientes: ninguna. Identificadores verificados: CIK, mercado y cierre
# fiscal con la SEC; ISIN (dígito de control) con OpenFIGI; LEI con GLEIF (nombre legal y
# jurisdicción coinciden con el estado de constitución de la SEC).

# --- Salud --------------------------------------------------------------------------------------
# Excluidas tras revisar sus datos: Johnson & Johnson, Pfizer y Merck & Co. (no publican resultado
# operativo: su cuenta de resultados pasa de los gastos al resultado antes de impuestos, así que no
# hay EBIT ni EBITDA comparables). Tampoco lo publican Eli Lilly, Bristol-Myers Squibb, Zoetis ni
# Biogen; Regeneron tiene dos clases de acciones y Vertex no tiene bonos. Gilead sí publica resultado
# operativo, pero en los informes trimestrales etiqueta la amortización de intangibles con una
# etiqueta que la herramienta no lee (AdjustmentForAmortization), así que solo habría EBITDA de
# ejercicios completos y no de los doce últimos meses. Se sustituyen por AbbVie y Amgen
# (farmacéuticas) y Stryker (tecnología médica), grandes emisores de EE. UU. con acciones y bonos.

# Abbott: tecnología médica, diagnóstico, nutrición y genéricos de marca; la mayor parte del negocio
# es tecnología médica. Su balance solo tiene dos líneas de deuda (no presenta préstamos a corto
# desde 2022). La deuda a largo sube de 9.896 a unos 29.600 millones en 2026 por la financiación de
# la compra de Exact Sciences.
- id: ABT
  name: Abbott Laboratories
  cik: "0000001800"
  ticker: ABT
  isin: US0028241000
  lei: HQD377W2YR662HK5JX27
  exchange: XNYS
  country: US
  sector: health_care
  industry: medical_devices
  currency: USD
  fiscal_year_end_month: 12
  debt:
    - {line: "Vencimientos a un año de la deuda a largo", tags: [LongTermDebtCurrent]}
    - {line: "Deuda a largo plazo", tags: [LongTermDebtNoncurrent], required: true}

