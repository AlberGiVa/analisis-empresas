# --- Energía ------------------------------------------------------------------------------------
# Excluidas tras revisar sus datos: Exxon Mobil, Chevron y ConocoPhillips (no publican resultado
# operativo; Exxon, además, cotiza desde julio de 2026 a través de una sociedad holding nueva con
# otro CIK y casi sin historia en los datos estructurados). Tampoco publican resultado operativo
# Occidental, Phillips 66 ni Devon. EOG y Diamondback sí lo publican, pero reparten sus inversiones
# en varias líneas sin dar el total (no habría flujo de caja libre), y Valero deja de etiquetar sus
# inversiones con una etiqueta estándar desde el cuarto trimestre de 2025. Se eligen tres grandes
# emisores de EE. UU. con acciones y bonos que publican todas las partidas, uno por cada parte de la
# cadena del petróleo y el gas: refino (Marathon Petroleum), producción (EQT) y transporte (Kinder
# Morgan).

# Marathon Petroleum: consolida MPLX (participada cotizada), así que su deuda incluye la de MPLX y el
# patrimonio total incluye minoritarios importantes. Las líneas de deuda incluyen los arrendamientos
# financieros, que la empresa presenta dentro de la deuda.
