  # --- Seguros ------------------------------------------------------------------------------------
  # Mapfre: aseguradora, cuentas NIIF 17. LEI entre comillas (solo tiene cifras). Su cuenta de
  # resultados no tiene un total de ingresos: la primera línea son los «ingresos por contratos de
  # seguro» (26.352 M en 2025, etiqueta propia), que se fijan como ventas. No incluyen los ingresos
  # financieros (3.082 M), los del servicio de reaseguro ni otros ingresos; los «ingresos» de
  # 34.074 M de su informe de gestión son primas y otros ingresos con criterio contable local, fuera
  # de las cuentas NIIF. Sin resultado operativo (`ebit: []`). Gasto financiero: los «costes
  # financieros» de la cuenta de resultados (732 M, sobre todo de su cartera de inversiones; los
  # intereses pagados por su deuda son 90 M); la cobertura de intereses no aplica a aseguradoras.
  # Deuda: las tres líneas de su balance que la forman: pasivos subordinados (1.631 M, la mayor y la
  # obligatoria), obligaciones y valores negociables (866 M, deuda sénior) y préstamos bancarios
  # (125 M). Suman 2.622 M, la deuda de la estructura de capital que publica (20 % de 13.136 M con
  # el patrimonio). Fuera, los «otros pasivos financieros» y las cuentas a pagar.
