  # --- Salud --------------------------------------------------------------------------------------
  # Id SANF y no su ticker (SAN): SAN ya es el id de Banco Santander en el universo. Sin acciones en
  # circulación: ver la cabecera. Ventas fijadas: el total de ventas netas (43.626 M); su cuenta no
  # da un total de ingresos y los «otros ingresos» (3.090 M, sobre todo vacunas distribuidas por
  # socios y regalías) quedan fuera, aunque sí están en el beneficio bruto (el margen bruto sale algo
  # alto). Amortizaciones fijadas: la línea del estado de flujos que suma amortizaciones y deterioros
  # de inmovilizado, derechos de uso e intangibles (5.678 M en 2025, con 2.241 M de deterioro de
  # intangibles, que también se suman, como hace el EBITDA habitual). En 2025 vendió el control de
  # Opella (actividad interrumpida): el beneficio atribuido (7.813 M) incluye 2.874 M de esa
  # actividad y el flujo operativo 189 M; ventas y resultado operativo son solo de las actividades
  # que continúan. Deuda: bonos, papel comercial y préstamos; fuera los derivados (112 M) y los
  # arrendamientos (1.739 M). La inversión incluye los intangibles (licencias), con su aviso.
  - id: SANF
