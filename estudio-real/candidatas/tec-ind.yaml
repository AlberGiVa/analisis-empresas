  # --- Fragmento: tecnología e industria (EE. UU.) -------------------------------------------------
  #
  # Identificadores verificados el 20/10/2026: CIK con el índice de entidades de EDGAR y el fichero
  # de presentaciones de la SEC (que también da el cierre del ejercicio y el mercado); ISIN con su
  # dígito de control y con OpenFIGI; LEI con GLEIF (por ISIN y por nombre: razón social y
  # jurisdicción); mercado con Yahoo Finance.
  #
  # Estado (21/10/2026): comprobadas las 8 con apoyo/comprobar_empresas.py e incorporadas a
  # universo.yaml. Apple y Cisco pasan a la industria «Equipos tecnológicos» y Cisco lleva sus
  # amortizaciones fijadas (`depreciation:`) para que el EBITDA no salga infravalorado.
  #
  # Excluidas tras revisar sus datos (texto para la cabecera del universo):
  # - IBM: no publica resultado operativo, así que no hay EBIT ni EBITDA (como Clorox). La sustituye
  #   Oracle.
  # - Caterpillar: sus balances trimestrales separan Maquinaria y Productos Financieros y en los
  #   datos estructurados de la SEC solo aparece la deuda consolidada al cierre del año, sin los
  #   vencimientos a un año; tampoco aparece el gasto financiero. Sin vista de acreedor. La sustituye
  #   Wabtec (mismo subsector: maquinaria pesada y equipos de transporte).
  # - Deere: no publica resultado operativo consolidado desde el ejercicio 2025 (el último en los
  #   datos estructurados es el de 2024). La sustituye AGCO (maquinaria agrícola, su competidor
  #   directo; mediana capitalización).
  # - Honeywell: contrasplit de 1 por 2 el 29/06/2026 (nuevo ISIN: el anterior ya no figura en
  #   OpenFIGI) y la cifra de acciones nueva no se publica hasta el 23/07/2026, así que la
  #   capitalización a 30/06/2026 saldría el doble; además está en plena separación en varias
  #   empresas y su gasto financiero cambió de etiqueta en 2026 sin dato anual (no hay doce meses).
  #   La sustituye 3M (conglomerado industrial).
  # - Union Pacific: solo publica «Depreciation» (no tiene amortización de intangibles) y el estudio
  #   no acepta esa etiqueta sola como amortizaciones, así que no hay EBITDA. La sustituye CSX
  #   (ferrocarril). Entraría si `DEPRECIATION_SOURCES` (sec.py) admitiera `Depreciation` sola.
  # Financieras cautivas: con Caterpillar y Deere fuera, ninguna empresa del grupo consolida una
  # financiera (la de AGCO es una sociedad conjunta con Rabobank que no consolida).

