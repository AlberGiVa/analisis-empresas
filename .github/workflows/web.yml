# Web pública (GitHub Pages): ejemplo completo y empresas reales con datos de uso libre (SEC y BCE).
#
# Se construye en cada cambio de main, cada mañana de martes a sábado (tras el cierre de EE. UU. y
# la publicación de los tipos del BCE) y a mano desde la pestaña Actions («Run workflow»). Antes de
# publicar pasa formato, lint, tipos y tests. Si algo falla, no se publica nada y sigue en línea la
# versión anterior. Los datos se descargan al construir: nunca se guardan en el repositorio.
# Las acciones de terceros van fijadas por su commit (con la versión al lado), no por una etiqueta
# que se pueda mover. Decisión 0018.
name: Web pública

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 2-6"   # 05:30 UTC de martes a sábado
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Madrid   # fechas y horas de la web en hora peninsular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Formato, lint y tipos
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m mypy
      - name: Tests
        run: uv run python -m pytest -q
      - name: Construir la web
        env:
          # Opcional: nombre y correo de contacto con que la SEC pide que se identifiquen los
          # programas (secreto del repositorio). Sin él, se usa la identificación por defecto.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then export ANALYSIS_HTTP_USER_AGENT="$SEC_USER_AGENT"; fi
          uv run python -m company_analysis.web construir --salida _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
