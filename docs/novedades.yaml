# Novedades de la herramienta, la más reciente primero. Alimentan la página «Novedades» de la web.
# Para añadir una, cópiala al principio: fecha, titulo, texto (1-3 frases) y enlace (opcional).

- fecha: "2026-10-20"
  titulo: "La web, con la imagen de Luceiro Capital"
  texto: >-
    Toda la web lleva el logo, los colores y la tipografía de Luceiro Capital, con un índice a la
    izquierda y modo claro u oscuro. La presentación de la herramienta ya se puede abrir desde la
    propia web.
  enlace: "presentacion.html"

- fecha: "2026-10-20"
  titulo: "Web pública"
  texto: >-
    La herramienta se puede consultar desde cualquier sitio, sin instalar nada y sin usuario ni
    contraseña. Muestra las 20 empresas ficticias del ejemplo con todas las funciones y las diez
    empresas reales con datos públicos de la SEC y del BCE, sin cotizaciones. Se actualiza sola
    cada mañana, de martes a sábado.
  enlace: "index.html"

- fecha: "2026-10-20"
  titulo: "Estudio con diez empresas reales"
  texto: >-
    Primera prueba con cifras reales: diez empresas de consumo básico de EE. UU., con las cuentas
    que presentan en la SEC. El informe las compara entre sí, muestra qué ha cambiado entre dos
    fechas y de dónde sale cada dato, con sus avisos de calidad.
  enlace: "reales/index.html"

- fecha: "2026-10-20"
  titulo: "Muestra interactiva y fuentes públicas"
  texto: >-
    Una página que explica de un vistazo cómo está conectada y pensada la herramienta, con los
    resultados del ejemplo y la hoja de ruta. Prueba en vivo varias fuentes públicas gratuitas,
    como los tipos de cambio del BCE.
  enlace: "presentacion.html"

- fecha: "2026-10-20"
  titulo: "Datos reales desde Excel"
  texto: >-
    Los datos de Bloomberg, FactSet o tecleados a mano entran con una plantilla de Excel en
    español. Antes de cargar nada se revisa el libro entero y, si algo no cuadra, se indica la
    hoja, la fila y la columna.

- fecha: "2026-10-20"
  titulo: "Crédito solo con bonos vivos"
  texto: >-
    La puntuación de crédito exige que la empresa tenga bonos vivos, porque el diferencial de sus
    bonos es un factor obligatorio. Sin bonos se siguen mostrando los ratios de deuda. En la
    ficha, la tabla de bonos ocupa todo el ancho y se lee mejor.
  enlace: "como-funciona.html"

- fecha: "2026-10-20"
  titulo: "Fichas, ranking y panel"
  texto: >-
    Cada empresa tiene una ficha con la vista de accionista y la de acreedor lado a lado, el
    desglose de cada puntuación, los bonos, las alertas y el histórico. Hay un ranking en HTML y
    en CSV para Excel, y un panel con filtros que solo se abre en el propio equipo. El diario del
    analista guarda notas y tesis, y nunca se publica en la web.
  enlace: "ejemplo/ranking.html"

- fecha: "2026-10-20"
  titulo: "Puntuaciones, filtros y alertas"
  texto: >-
    Cada empresa recibe una puntuación de accionista y otra de crédito, de 0 a 100, frente a las
    de su sector, y cada una se descompone factor a factor. Los filtros dicen si una empresa
    cumple un criterio; las alertas avisan de rebajas de rating, apalancamiento alto o cambios
    bruscos de puntuación. Cada ejecución queda registrada con su fecha, sus datos y su
    configuración.
  enlace: "como-funciona.html"

- fecha: "2026-10-20"
  titulo: "Métricas con su fórmula"
  texto: >-
    Siete métricas de accionista y cuatro de crédito, cada una con su fórmula documentada. Las
    cifras se llevan a doce meses y a euros. Un dato que falta o no aplica, como el EBITDA de un
    banco, se marca con su motivo.
  enlace: "como-funciona.html"

- fecha: "2026-10-20"
  titulo: "Datos de ejemplo y lectura a fecha"
  texto: >-
    20 empresas ficticias con casos difíciles: bancos, ejercicios que no cierran en diciembre,
    datos que faltan o un bono sin rating. Cada dato guarda su fecha de publicación y nunca se
    sobrescribe, así que un análisis a una fecha pasada solo ve lo que se sabía entonces.
  enlace: "ejemplo/ranking.html"

- fecha: "2026-10-20"
  titulo: "Arranque del proyecto"
  texto: >-
    La base de la herramienta y sus principios: apoya al gestor sin decidir por él, explica cada
    cifra y no inventa datos. Funciona con el Python oficial del equipo, sin chocar con el
    antivirus corporativo.
