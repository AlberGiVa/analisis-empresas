# Traducción al inglés de la web pública (company_analysis.i18n).
#
# - exact: frases completas, español → inglés (los espacios y saltos de línea no cuentan).
# - patterns: frases con cifras, fechas o nombres. "es" es una expresión regular que debe cubrir la
#   frase entera; sus grupos con nombre se traducen a su vez (o se dejan como están, con las cifras en
#   notación inglesa) y "en" los coloca con {nombre}.
#
# Lo que no está aquí se queda en español y se lista al construir la web.
#
# Notas para mantenerlo:
# - Las entradas exactas se buscan antes que los patrones, y los patrones en el orden de la lista:
#   los más concretos van primero y los genéricos (listas, sumas de etiquetas) al final.
# - Un grupo solo pasa sin traducción si no tiene dos minúsculas seguidas (cifras, códigos en
#   mayúsculas). Por eso las etiquetas XBRL tienen su entrada exacta (se quedan igual) y los códigos
#   con hexadecimal (ejecución, huella, commit) se parten en caracteres sueltos.
# - Un grupo traducido pierde los espacios de los extremos: los separadores van en "en", no en el
#   grupo.
# - Los patrones se aplican dentro de los grupos hasta cuatro niveles; a partir de ahí solo valen
#   las entradas exactas y las cifras.
#
# Terminología: ficha = company sheet; puntuación = score; cobertura = coverage; diferencial =
# spread; tramo de rating = rating bucket; prelación = seniority; filtro = screen; aviso de calidad =
# data-quality warning; ejecución = run; lectura a fecha = point-in-time reading.

