  # --- Métricas: diccionario (descripción, fórmula, interpretación y casos límite) ---------------
  # PER
  "Veces que la capitalización bursátil contiene el beneficio neto atribuible de los últimos doce meses.": "Number of times market capitalisation covers the attributable net income of the last twelve months."
  "Capitalización bursátil / Beneficio neto atribuible LTM": "Market capitalisation / LTM attributable net income"
  "Cuanto más bajo, más barata la acción en relación con sus beneficios. Conviene compararlo dentro del sector: el crecimiento y el riesgo justifican múltiplos distintos.": "The lower it is, the cheaper the share relative to its earnings. Best compared within the sector: growth and risk justify different multiples."
  "Beneficio negativo: no significativo (no existe múltiplo de unas pérdidas).": "Negative earnings: not meaningful (there is no multiple of a loss)."
  "Beneficio cero: división por cero.": "Zero earnings: division by zero."
  "Cotización ausente o con más antigüedad de la permitida: sin dato o dato desactualizado.": "Share price missing or older than allowed: no data or stale data."
  # EV/EBITDA
  "Valor de empresa (capitalización más deuda neta) en relación con el EBITDA de los últimos doce meses.": "Enterprise value (market capitalisation plus net debt) relative to EBITDA over the last twelve months."
  "(Capitalización bursátil + Deuda financiera − Caja) / EBITDA LTM": "(Market capitalisation + Financial debt − Cash) / LTM EBITDA"
  "Cuanto más bajo, más barata la empresa en relación con su generación operativa, con independencia de cómo se financia. Simplificación: el valor de empresa no incluye intereses minoritarios ni otros ajustes.": "The lower it is, the cheaper the company relative to its operating earnings, regardless of how it is financed. Simplification: enterprise value does not include minority interests or other adjustments."
  "EBITDA negativo: no significativo.": "Negative EBITDA: not meaningful."
  "EBITDA cero: división por cero.": "Zero EBITDA: division by zero."
  "Valor de empresa negativo o nulo (la caja neta supera la capitalización): no significativo.": "Negative or zero enterprise value (net cash exceeds market capitalisation): not meaningful."
  "Bancos y aseguradoras: no aplica.": "Banks and insurers: not applicable."
  # FCF yield
  "Flujo de caja libre de los últimos doce meses en relación con la capitalización bursátil.": "Free cash flow over the last twelve months relative to market capitalisation."
  "(Flujo de caja operativo LTM − Capex LTM) / Capitalización bursátil": "(LTM operating cash flow − LTM capex) / Market capitalisation"
  "Cuanto más alto, más caja genera la empresa por cada euro de capitalización. Un valor negativo indica que consume caja.": "The higher it is, the more cash the company generates per euro of market capitalisation. A negative value means it burns cash."
  "Flujo de caja libre negativo: valor válido (negativo).": "Negative free cash flow: valid value (negative)."
  "Falta el flujo operativo o el capex: sin dato.": "Operating cash flow or capex missing: no data."
  "Bancos y aseguradoras: no aplica (sus flujos operativos incluyen depósitos y préstamos).": "Banks and insurers: not applicable (their operating cash flows include deposits and loans)."
  # ROE
  "Rentabilidad del beneficio neto atribuible sobre el patrimonio neto atribuible al cierre del periodo.": "Return of attributable net income on attributable equity at the end of the period."
  "Beneficio neto atribuible LTM / Patrimonio neto atribuible al cierre": "LTM attributable net income / Attributable equity at period end"
  "Cuanto más alta, más rentable es el capital de los accionistas. Puede inflarse con mucho apalancamiento: conviene leerla junto con la deuda.": "The higher it is, the more profitable the shareholders' capital. High leverage can inflate it: read it together with debt."
  "Patrimonio negativo: no significativo.": "Negative equity: not meaningful."
  "Patrimonio cero: división por cero.": "Zero equity: division by zero."
  "Beneficio negativo: valor válido (negativo).": "Negative earnings: valid value (negative)."
  "Se usa el patrimonio al cierre y no la media del periodo (simplificación).": "Equity at period end is used, not the average over the period (simplification)."
  # ROIC
  "Rentabilidad operativa después de impuestos sobre el capital invertido (patrimonio más deuda neta).": "After-tax operating return on invested capital (equity plus net debt)."
  "EBIT LTM × (1 − tipo impositivo teórico) / (Patrimonio neto total + Deuda financiera − Caja)": "LTM EBIT × (1 − notional tax rate) / (Total equity + Financial debt − Cash)"
  "Cuanto más alta, más valor crea la empresa con el capital que emplea. El tipo impositivo teórico (25 % por defecto) se configura en config/analysis.yaml.": "The higher it is, the more value the company creates with the capital it employs. The notional tax rate (25 % by default) is set in config/analysis.yaml."
  "Capital invertido negativo (la caja neta supera el patrimonio): no significativo.": "Negative invested capital (net cash exceeds equity): not meaningful."
  "Capital invertido cero: división por cero.": "Zero invested capital: division by zero."
  "EBIT negativo: valor válido (negativo).": "Negative EBIT: valid value (negative)."
  # Margen EBITDA
  "Parte de las ventas que se convierte en EBITDA.": "Share of revenue that turns into EBITDA."
  "EBITDA LTM / Ventas LTM": "LTM EBITDA / LTM revenue"
  "Cuanto más alto, más rentable es la operación. Los márgenes difieren mucho entre sectores.": "The higher it is, the more profitable the operations. Margins differ widely between sectors."
  "EBITDA negativo: valor válido (margen negativo).": "Negative EBITDA: valid value (negative margin)."
  "Ventas cero: división por cero; ventas negativas: no significativo.": "Zero revenue: division by zero; negative revenue: not meaningful."
  # Crecimiento de ventas
  "Variación de las ventas de los últimos doce meses frente a los doce meses anteriores.": "Change in revenue over the last twelve months versus the previous twelve months."
  "Ventas LTM / Ventas LTM de un año antes − 1": "LTM revenue / LTM revenue a year earlier − 1"
  "Cuanto más alto, más crece el negocio. Se calcula en la divisa de reporte para no mezclar el efecto de los tipos de cambio.": "The higher it is, the faster the business grows. It is calculated in the reporting currency so as not to mix in the effect of exchange rates."
  "Faltan las ventas del año anterior: sin dato.": "Prior-year revenue missing: no data."
  "Ventas del año anterior cero: división por cero; negativas: no significativo.": "Zero prior-year revenue: division by zero; negative: not meaningful."
  # Deuda neta/EBITDA
  "Años de EBITDA necesarios para pagar la deuda neta.": "Years of EBITDA needed to repay net debt."
  "(Deuda financiera − Caja) / EBITDA LTM": "(Financial debt − Cash) / LTM EBITDA"
  "Cuanto más bajo, menor endeudamiento. Un valor negativo indica caja neta (más caja que deuda).": "The lower it is, the lower the indebtedness. A negative value means net cash (more cash than debt)."
  "EBITDA negativo: no significativo (si además hay deuda neta positiva, salta la alerta de apalancamiento).": "Negative EBITDA: not meaningful (if net debt is also positive, the leverage alert is triggered)."
  "Caja neta: valor negativo válido.": "Net cash: valid negative value."
  # Cobertura de intereses
  "Veces que el EBITDA cubre los gastos financieros.": "Number of times EBITDA covers interest expense."
  "EBITDA LTM / Gastos financieros LTM": "LTM EBITDA / LTM interest expense"
  "Cuanto más alta, más holgura para pagar los intereses.": "The higher it is, the more headroom to pay interest."
  "Sin gastos financieros (por ejemplo, sin deuda): división por cero.": "No interest expense (for example, no debt): division by zero."
  "EBITDA negativo: valor válido (cobertura negativa).": "Negative EBITDA: valid value (negative coverage)."
  # Deuda/capital
  "Deuda financiera en relación con el patrimonio neto total.": "Financial debt relative to total equity."
  "Deuda financiera / Patrimonio neto total": "Financial debt / Total equity"
  "Cuanto más baja, menos apalancada está la empresa en términos de balance.": "The lower it is, the less leveraged the company's balance sheet."
  "Sin deuda: valor cero, válido.": "No debt: zero, a valid value."
  "Bancos y aseguradoras: no aplica (su deuda incluye la financiación de su actividad).": "Banks and insurers: not applicable (their debt includes the funding of their business)."
  # Diferencial frente a su tramo de rating
  "Diferencia entre el diferencial de cada bono y la mediana de los bonos de su mismo tramo de rating. Para la empresa, la mediana de sus bonos.": "Difference between each bond's spread and the median of the bonds in the same rating bucket. For the company, the median of its bonds."
  "Por bono: Diferencial del bono − Mediana del diferencial de los bonos del mismo tramo de rating y tipo de diferencial. Por empresa: mediana de sus bonos.": "Per bond: Bond spread − Median spread of the bonds in the same rating bucket and of the same spread type. Per company: median of its bonds."
  "Positivo: el bono paga más que sus comparables de rating (más compensación por el mismo rating). Negativo: paga menos. En la puntuación de crédito, más alto puntúa mejor; el deterioro se vigila con las alertas y los factores de apalancamiento.": "Positive: the bond pays more than its rating peers (more compensation for the same rating). Negative: it pays less. In the credit score, higher scores better; deterioration is monitored through the alerts and the leverage factors."
  "Bono sin rating: sin dato.": "Bond without a rating: no data."
  "Tramo con menos bonos del mínimo (3 por defecto): sin comparables suficientes.": "Bucket with fewer bonds than the minimum (3 by default): not enough peers."
  "Cotización con más antigüedad de la permitida: dato desactualizado.": "Price older than allowed: stale data."
  "Empresa sin bonos vivos: no aplica.": "Company without outstanding bonds: not applicable."
  "Bono con ratings de varias agencias: se usa el peor.": "Bond rated by several agencies: the worst rating is used."
  # Magnitudes en euros
  "Valor en bolsa de todas las acciones de la empresa.": "Stock-market value of all the company's shares."
  "Cotización × Acciones en circulación, convertida a euros al tipo de cambio de la fecha de la cotización": "Share price × Shares outstanding, converted to euros at the exchange rate of the price date"
  "Tamaño de la empresa en bolsa; útil para filtrar el universo.": "Size of the company on the stock market; useful to screen the universe."
  "Falta el dato de origen o el tipo de cambio: sin dato.": "Source figure or exchange rate missing: no data."
  "Los valores negativos (por ejemplo, EBITDA o deuda neta) son válidos.": "Negative values (for example, EBITDA or net debt) are valid."
  "Capitalización más deuda neta: el valor del negocio para todos sus financiadores.": "Market capitalisation plus net debt: the value of the business to all its providers of capital."
  "(Capitalización + Deuda financiera − Caja) en la divisa de reporte, convertido a euros al tipo de cambio de la fecha de la cotización": "(Market capitalisation + Financial debt − Cash) in the reporting currency, converted to euros at the exchange rate of the price date"
  "Base de los múltiplos de valoración de empresa (EV/EBITDA).": "Basis of the enterprise-value multiples (EV/EBITDA)."
  "Ventas de los últimos doce meses, en euros.": "Revenue over the last twelve months, in euros."
  "Ventas LTM convertidas a euros al tipo de cambio medio de esos doce meses": "LTM revenue converted to euros at the average exchange rate of those twelve months"
  "Tamaño del negocio, comparable entre empresas de distinta divisa.": "Size of the business, comparable across companies with different currencies."
  "EBITDA de los últimos doce meses, en euros.": "EBITDA over the last twelve months, in euros."
  "EBITDA LTM convertido a euros al tipo de cambio medio de esos doce meses": "LTM EBITDA converted to euros at the average exchange rate of those twelve months"
  "Generación operativa del negocio, comparable entre divisas.": "Operating earnings of the business, comparable across currencies."
  "Deuda financiera menos caja al cierre del periodo, en euros.": "Financial debt minus cash at period end, in euros."
  "(Deuda financiera − Caja) convertida a euros al tipo de cambio de la fecha de cierre del periodo": "(Financial debt − Cash) converted to euros at the exchange rate of the period-end date"
  "Endeudamiento en términos absolutos; negativa si hay caja neta.": "Indebtedness in absolute terms; negative if there is net cash."
  # Motivos de exclusión
  "No aplica a bancos y aseguradoras: su EBITDA, su deuda y su valor de empresa no son comparables con los de una empresa no financiera.": "Not applicable to banks and insurers: their EBITDA, debt and enterprise value are not comparable with those of a non-financial company."
  "No aplica a bancos y aseguradoras: sus flujos de caja operativos incluyen los movimientos de depósitos, préstamos e inversiones de su actividad.": "Not applicable to banks and insurers: their operating cash flows include the movements in deposits, loans and investments of their business."
  "No aplica a bancos y aseguradoras: su deuda incluye depósitos y la financiación de su actividad, y su solvencia se mide con ratios de capital.": "Not applicable to banks and insurers: their debt includes deposits and the funding of their business, and their solvency is measured with capital ratios."

