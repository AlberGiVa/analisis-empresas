  "LongTermDebt": "LongTermDebt"
  "OtherLongTermDebtNoncurrent": "OtherLongTermDebtNoncurrent"
  "OtherShortTermBorrowings": "OtherShortTermBorrowings"
  "OtherBorrowings": "OtherBorrowings"
  "NotesPayable": "NotesPayable"
  "LoansPayable": "LoansPayable"
  "SeniorNotes": "SeniorNotes"
  "SecuredDebt": "SecuredDebt"
  "UnsecuredDebt": "UnsecuredDebt"
  "ConvertibleNotesPayable": "ConvertibleNotesPayable"
  "FinanceLeaseLiabilityCurrent": "FinanceLeaseLiabilityCurrent"
  "FinanceLeaseLiabilityNoncurrent": "FinanceLeaseLiabilityNoncurrent"
  "AdvancesFromFederalHomeLoanBanks": "AdvancesFromFederalHomeLoanBanks"
