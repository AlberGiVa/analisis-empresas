  "Lo que se ha comprobado o supuesto para cada empresa. Las etiquetas son los conceptos XBRL de la SEC de los que sale cada partida; «publicaciones corregidas» cuenta las cifras que una empresa cambió en un informe posterior (la herramienta guarda las dos versiones y usa la que se conocía en cada fecha).": "What has been checked or assumed for each company. The tags are the SEC XBRL concepts each line item comes from; “Restatements” counts the figures a company changed in a later report (the tool keeps both versions and uses the one known at each date)."
