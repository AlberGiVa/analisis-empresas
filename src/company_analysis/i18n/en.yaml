  "Vencimientos a un año de la deuda a largo": "Current maturities of long-term debt"
  "Deuda a largo plazo": "Long-term debt"
  "Deuda a corto plazo (incluye papel comercial y vencimientos a un año)": "Short-term debt (includes commercial paper and current maturities)"
  "Préstamos a corto plazo": "Short-term borrowings"
  "Papel comercial y otra deuda a corto": "Commercial paper and other short-term debt"
  "Pagarés a corto plazo": "Short-term notes payable"
  "Préstamos a corto y vencimientos a un año": "Short-term borrowings and current maturities"
  "Obligaciones a largo plazo": "Long-term obligations"
  "Deuda con vencimiento a un año": "Debt due within one year"
