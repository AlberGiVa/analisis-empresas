  # --- Cómo funciona -----------------------------------------------------------------------------
  "Guía de lectura": "Reading guide"
  "La herramienta mira cada empresa desde dos sitios: el de quien tiene sus acciones y el de quien le ha prestado dinero comprando sus bonos. Para cada uno calcula métricas, las compara con empresas parecidas y las resume en una puntuación que siempre se puede desglosar.": "The tool looks at each company from two standpoints: that of whoever holds its shares and that of whoever has lent it money by buying its bonds. For each one it calculates metrics, compares them with similar companies and sums them up in a score that can always be broken down."
  "Las dos vistas": "The two views"
  "Como accionista": "As a shareholder"
  "Como acreedor": "As a creditor"
  "Valoración:": "Valuation:"
  "si la empresa cotiza cara o barata frente a lo que gana o genera.": "whether the company trades expensive or cheap relative to what it earns or generates."
  "Rentabilidad:": "Profitability:"
  "cuánto rinde el dinero que tiene invertido.": "how much return it makes on the money invested in it."
  "Crecimiento:": "Growth:"
  "cuánto crecen sus ventas.": "how fast its revenue grows."
  "Endeudamiento:": "Indebtedness:"
  "cuántos años de generación de caja haría falta para pagar la deuda.": "how many years of cash generation it would take to repay the debt."
  "Capacidad de pago:": "Debt-service capacity:"
  "cuántas veces cubre lo que genera los intereses de su deuda.": "how many times what it generates covers the interest on its debt."
  "Diferencial de sus bonos:": "Spread of its bonds:"
  "cuánto paga de más frente a bonos con su mismo rating.": "how much more it pays than bonds with the same rating."
  "Cómo se calcula una puntuación": "How a score is calculated"
  "Cada métrica se calcula con su fórmula, que está en el diccionario de abajo.": "Each metric is calculated with its formula, which is in the dictionary below."
  "La puntuación es la media ponderada de esos percentiles. Cada ficha muestra cuánto aporta cada factor.": "The score is the weighted average of those percentiles. Each company sheet shows how much each factor contributes."
  "La cobertura dice qué parte del peso tenía dato. Por debajo del mínimo, la puntuación no se muestra.": "Coverage says how much of the weight had data. Below the minimum, the score is not shown."
  "Factores y pesos": "Factors and weights"
  "Las empresas reales no tienen cotizaciones en esta web (las condiciones de los servicios gratuitos no permiten republicarlas) ni diferenciales de bonos (no hay una fuente gratuita y fiable). Por eso sus puntuaciones usan menos factores que las del ejemplo.": "The real companies have no share prices on this website (the terms of the free services do not allow republishing them) and no bond spreads (there is no free, reliable source). That is why their scores use fewer factors than those of the example."
  "Lo que la herramienta no hace": "What the tool does not do"
  "No recomienda.": "It does not recommend."
  "Describe y compara; la decisión es siempre del gestor.": "It describes and compares; the decision always rests with the portfolio manager."
  "No inventa datos.": "It does not make up data."
  "Un dato que falta o no aplica aparece como «Sin dato» o «No aplica», con el motivo.": "A figure that is missing or does not apply appears as “No data” or “Not applicable”, with the reason."
  "No mira al futuro.": "It does not look ahead."
  "Un análisis a una fecha solo usa lo que se había publicado hasta ese día.": "An analysis as of a date only uses what had been published by that day."
  "No retoca las cifras.": "It does not adjust the figures."
  "Usa las cuentas tal como se publican, sin los ajustes que comunican las empresas.": "It uses the accounts as published, without the adjustments the companies announce."
  "Glosario": "Glossary"
