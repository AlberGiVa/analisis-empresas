  "Pasa el ratón por una celda sin valor para ver el motivo. Cada ficha despliega la fórmula y los datos de entrada de cada métrica. Los avisos llevan a la sección de calidad de datos: léelos antes de sacar conclusiones de una cifra.": "Hover over a cell without a value to see the reason. Each company sheet expands the formula and the inputs of every metric. The warnings link to the data-quality section: read them before drawing conclusions from a figure."
  "Rentabilidad frente a apalancamiento": "Profitability versus leverage"
  "Valoración frente a apalancamiento": "Valuation versus leverage"
  "Cada punto es una empresa. A la derecha, más margen EBITDA (lo que queda de cada euro vendido antes de amortizaciones, intereses e impuestos); arriba, más endeudada en relación con lo que genera (deuda neta/EBITDA). Las líneas grises marcan la mediana del grupo.": "Each dot is a company. Further right, a higher EBITDA margin (what is left of each euro of sales before depreciation and amortisation, interest and taxes); further up, more indebted relative to what it generates (net debt/EBITDA). The grey lines mark the group median."
  "Cada punto es una empresa. A la derecha, más cara en relación con lo que genera (EV/EBITDA); arriba, más endeudada en relación con lo que genera (deuda neta/EBITDA). Las líneas grises marcan la mediana del grupo.": "Each dot is a company. Further right, more expensive relative to what it generates (EV/EBITDA); further up, more indebted relative to what it generates (net debt/EBITDA). The grey lines mark the group median."
