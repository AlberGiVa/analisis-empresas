  ". Los arrendamientos solo cuentan cuando la empresa los incluye en esas líneas; los operativos nunca (su coste ya está en el EBITDA).": ". Leases only count when the company includes them in those lines; operating leases never do (their cost is already in EBITDA)."
  "Crédito.": "Credit."
  "Sin diferenciales de bonos ni ratings: la puntuación de acreedor solo usa apalancamiento, cobertura de intereses y deuda sobre capital. La alerta de rebaja de rating no puede saltar.": "No bond spreads or ratings: the creditor score only uses leverage, interest coverage and debt to equity. The rating-downgrade alert cannot be triggered."
