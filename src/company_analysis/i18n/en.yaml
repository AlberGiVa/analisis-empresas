patterns:
  # === Códigos y unidades ===========================================================================
  # Identificador de ejecución: R + fecha y hora + 6 caracteres hexadecimales.
  - es: 'R(?P<t>\d{8}T\d{6})-(?P<a>[0-9a-f])(?P<b>[0-9a-f])(?P<c>[0-9a-f])(?P<d>[0-9a-f])(?P<e>[0-9a-f])(?P<f>[0-9a-f])'
    en: "R{t}-{a}{b}{c}{d}{e}{f}"
  # Huella de la configuración y commit (6 a 12 caracteres hexadecimales), con o sin "-dirty".
  - es: '(?P<a>[0-9a-f])(?P<b>[0-9a-f])(?P<c>[0-9a-f])(?P<d>[0-9a-f])(?P<e>[0-9a-f])(?P<f>[0-9a-f])(?P<g>[0-9a-f]?)(?P<h>[0-9a-f]?)(?P<i>[0-9a-f]?)(?P<j>[0-9a-f]?)(?P<k>[0-9a-f]?)(?P<l>[0-9a-f]?)-dirty'
    en: "{a}{b}{c}{d}{e}{f}{g}{h}{i}{j}{k}{l}-dirty"
  - es: '(?P<a>[0-9a-f])(?P<b>[0-9a-f])(?P<c>[0-9a-f])(?P<d>[0-9a-f])(?P<e>[0-9a-f])(?P<f>[0-9a-f])(?P<g>[0-9a-f]?)(?P<h>[0-9a-f]?)(?P<i>[0-9a-f]?)(?P<j>[0-9a-f]?)(?P<k>[0-9a-f]?)(?P<l>[0-9a-f]?)'
    en: "{a}{b}{c}{d}{e}{f}{g}{h}{i}{j}{k}{l}"
  # Versiones de la metodología (texto libre en los YAML).
  - es: '(?P<a>\d[\d.]*)-web-(?P<b>\d+)'
    en: "{a}-web-{b}"
  - es: '(?P<a>\d[\d.]*)-estudio-(?P<b>\d+)'
    en: "{a}-estudio-{b}"
  # Ratings de Moody's con dos minúsculas (Aaa, Baa1…).
  - es: '(?P<x>[ABC])aa(?P<n>[1-3]?)'
    en: "{x}aa{n}"
  # Puntos básicos sueltos.
  - es: '(?P<v>[+−-]?\d[\d.,]*) pb'
    en: "{v} bp"
  - es: '(?P<n>\d+) lotes'
    en: "{n} loads"

  # === Etiquetas de cifras con divisa, tramo o grupo ===============================================
  - es: 'Capitalización \((?P<c>[A-Z]{3})\)'
    en: "Market cap ({c})"
  - es: 'Tipo de cambio (?P<p>[A-Z]{3}/[A-Z]{3})'
    en: "Exchange rate {p}"
  - es: 'Tipo de cambio medio (?P<p>[A-Z]{3}/[A-Z]{3})'
    en: "Average exchange rate {p}"
  - es: 'Mediana del tramo (?P<b>.+) \(pb\)'
    en: "Median of the {b} bucket (bp)"
  - es: '(?P<g>Sector|Universo) \((?P<n>\d+) empresas\)'
    en: "{g} ({n} companies)"
  - es: 'Histórico anual \(millones de (?P<c>[A-Z]{3})\)'
    en: "Annual history (millions of {c})"
  - es: 'Deuda financiera a (?P<d>\d\d/\d\d/\d{4}) \(millones\)'
    en: "Financial debt at {d} (millions)"

  # === Periodos de referencia ======================================================================
  - es: '(?P<p>FY|Q1|H1|9M) cerrado el (?P<e>\d\d/\d\d/\d{4}), publicado el (?P<pub>\d\d/\d\d/\d{4})'
    en: "{p} ended {e}, published on {pub}"
  - es: '(?P<p>FY|Q1|H1|9M) cerrado el (?P<e>\d\d/\d\d/\d{4})'
    en: "{p} ended {e}"
  - es: 'Periodo de referencia: (?P<ref>.+)'
    en: "Reference period: {ref}"

  # === Pies de página ==============================================================================
  - es: 'Ejecución (?P<run>\S+) · análisis a (?P<d>\d\d/\d\d/\d{4}) · datos cargados hasta el (?P<cut>\d\d/\d\d/\d{4} \d\d:\d\d) UTC \((?P<loads>\d+ lotes?)\) · configuración (?P<ver>\S+) \(huella (?P<hash>\w+)\) · código (?P<code>\S+) \((?P<commit>[^)]+)\) · generado el (?P<gen>\d\d/\d\d/\d{4} \d\d:\d\d)'
    en: "Run {run} · analysis as of {d} · data loaded up to {cut} UTC ({loads}) · configuration {ver} (fingerprint {hash}) · code {code} ({commit}) · generated on {gen}"
  - es: 'Ejecución (?P<run>\S+) · análisis a (?P<d>\d\d/\d\d/\d{4}) · datos cargados hasta el (?P<cut>\d\d/\d\d/\d{4} \d\d:\d\d) UTC \((?P<loads>\d+ lotes?)\) · configuración (?P<ver>\S+) \(huella (?P<hash>\w+)\) · código (?P<code>\S+) · generado el (?P<gen>\d\d/\d\d/\d{4} \d\d:\d\d)'
    en: "Run {run} · analysis as of {d} · data loaded up to {cut} UTC ({loads}) · configuration {ver} (fingerprint {hash}) · code {code} · generated on {gen}"
  - es: 'Luceiro Capital · prototipo de la herramienta de análisis · web generada el (?P<d>\d\d/\d\d/\d{4}) a las (?P<t>\d\d:\d\d) · código (?P<code>\S+) · empresas reales: SEC EDGAR y Banco Central Europeo · ejemplo: datos inventados'
    en: "Luceiro Capital · prototype of the analysis tool · website generated on {d} at {t} · code {code} · real companies: SEC EDGAR and European Central Bank · example: made-up data"
  - es: 'Luceiro Capital · prototipo de la herramienta de análisis · web generada el (?P<d>\d\d/\d\d/\d{4}) a las (?P<t>\d\d:\d\d) · empresas reales: SEC EDGAR y Banco Central Europeo · ejemplo: datos inventados'
    en: "Luceiro Capital · prototype of the analysis tool · website generated on {d} at {t} · real companies: SEC EDGAR and European Central Bank · example: made-up data"

  # === Inicio ======================================================================================
  - es: '(?P<n>\d+) empresas reales · análisis a (?P<d>\d\d/\d\d/\d{4})'
    en: "{n} real companies · analysis as of {d}"
  - es: 'Comparado con el (?P<p>\d\d/\d\d/\d{4}) · actualizada el (?P<g>\d\d/\d\d/\d{4}) a las (?P<t>\d\d:\d\d)'
    en: "Compared with {p} · updated on {g} at {t}"
  - es: 'actualizada el (?P<g>\d\d/\d\d/\d{4}) a las (?P<t>\d\d:\d\d)'
    en: "Updated on {g} at {t}"
  # Panel y Divisas
  - es: 'Actualizado el (?P<g>\d\d/\d\d/\d{4}) a las (?P<t>\d\d:\d\d) · empresas a (?P<d>\d\d/\d\d/\d{4})'
    en: "Updated on {g} at {t} · companies as of {d}"
  - es: 'Tipos de referencia del BCE: unidades de cada divisa por euro, a (?P<d>\d\d/\d\d/\d{4})\.'
    en: "ECB reference rates: units of each currency per euro, as of {d}."
  - es: '(?P<n>\d+) empresas · (?P<w>\d+) avisos? de calidad'
    en: "{n} companies · {w} data-quality warnings"
  - es: '· empresas a (?P<d>\d\d/\d\d/\d{4})'
    en: "· companies as of {d}"
  - es: '(?P<n>\d+) empresas de EE\. UU\. de varios sectores con sus cuentas oficiales y los tipos de cambio del BCE\. Análisis a (?P<d>\d\d/\d\d/\d{4})(?P<cmp>, comparado con el \d\d/\d\d/\d{4})?\. Sin cotizaciones: sus condiciones no permiten publicarlas\.'
    en: "{n} US companies from several sectors with their official accounts and ECB exchange rates. Analysis as of {d}{cmp}. No share prices: their terms do not allow publishing them."
  - es: ', comparado con el (?P<p>\d\d/\d\d/\d{4})'
    en: ", compared with {p}"
  - es: '(?P<n>\d+) empresas ficticias con datos inventados y todo lo que hace la herramienta: cotizaciones, bonos, ratings y diferenciales, con casos difíciles a propósito\. Análisis a (?P<d>\d\d/\d\d/\d{4})\.'
    en: "{n} fictitious companies with made-up data and everything the tool does: share prices, bonds, ratings and spreads, with deliberately difficult cases. Analysis as of {d}."
  - es: 'Ninguna a (?P<d>\d\d/\d\d/\d{4})\.'
    en: "None as of {d}."

  # === Casos de ejemplo ============================================================================
  - es: 'Casos de ejemplo · (?P<d>\d\d/\d\d/\d{4})'
    en: "Sample cases · {d}"
  - es: 'Casos de ejemplo · análisis a (?P<d>\d\d/\d\d/\d{4})'
    en: "Sample cases · analysis as of {d}"
  - es: 'Empresas ficticias con datos inventados: cada una muestra un caso que la herramienta sabe tratar\. Se comparan con las (?P<n>\d+) empresas del ejemplo, aunque aquí solo aparecen estas\.'
    en: "Fictitious companies with made-up data: each one shows a case the tool knows how to handle. They are compared with the {n} companies of the sample, although only these appear here."
  # «Empresa · identificador · sector» bajo el título de cada caso.
  - es: '(?P<name>.+) · (?P<id>[A-Z0-9.]+) · (?P<sector>Industria|Consumo|Tecnología|Utilities|Financiero|Salud|Energía)'
    en: "{name} · {id} · {sector}"

  # === Cómo funciona ===============================================================================
  - es: '(?P<label>Empresas reales|Ejemplo completo|Casos de ejemplo) · metodología (?P<ver>\S+)'
    en: "{label} · methodology {ver}"
  - es: 'Se muestra con una cobertura mínima del (?P<c>\d+) % y al menos 1 factores con dato\.'
    en: "Shown with a minimum coverage of {c} % and at least 1 factor with data."
  - es: 'Se muestra con una cobertura mínima del (?P<c>\d+) % y al menos (?P<n>\d+) factores con dato\.'
    en: "Shown with a minimum coverage of {c} % and at least {n} factors with data."
  - es: 'Se compara con las empresas de su sector que tienen ese dato \(si son menos de (?P<n>\d+), con todas\) y se expresa como percentil: 100 es la mejor del grupo\. Si en una métrica es mejor un valor bajo, como la deuda, el orden se invierte\.'
    en: "It is compared with the companies in its sector that have that figure (if there are fewer than {n}, with all of them) and expressed as a percentile: 100 is the best in the group. If a low value is better for a metric, such as debt, the order is reversed."
  # Unidad y sentido de cada métrica en el diccionario.
  - es: '· (?P<u>x|%|pb|M EUR) · (?P<dir>más alto es mejor|más bajo es mejor|informativa)'
    en: "· {u} · {dir}"
  - es: 'No aplica a (?P<inds>[^:]+): (?P<reason>No aplica a .+)'
    en: "Not applicable to {inds}: {reason}"

  # === Ranking =====================================================================================
  - es: 'Ranking · (?P<d>\d\d/\d\d/\d{4})'
    en: "Ranking · {d}"
  - es: 'Ranking · análisis a (?P<d>\d\d/\d\d/\d{4})'
    en: "Ranking · analysis as of {d}"
  - es: '(?P<n>\d+) empresas · 1 alertas · descarga para Excel:'
    en: "{n} companies · 1 alert · download for Excel:"
  - es: '(?P<n>\d+) empresas · (?P<a>\d+) alertas · descarga para Excel:'
    en: "{n} companies · {a} alerts · download for Excel:"
  - es: 'Cada factor se compara con las empresas de su sector que tienen dato \(o con todo el universo si el sector tiene menos de (?P<n>\d+)\) y se expresa como percentil: 100 es la mejor del grupo\. La puntuación es la media ponderada de esos percentiles\. La cobertura es la parte del peso de los factores aplicables que tenía dato; por debajo del mínimo, la puntuación no se muestra\. El detalle de cada factor está en la ficha de la empresa\.'
    en: "Each factor is compared with the companies in its sector that have data (or with the whole universe if the sector has fewer than {n}) and expressed as a percentile: 100 is the best in the group. The score is the weighted average of those percentiles. Coverage is the share of the weight of the applicable factors that had data; below the minimum, the score is not shown. The detail of each factor is in the company sheet."

  # === Ficha de empresa ============================================================================
  - es: '(?P<name>.+) · Ficha'
    en: "{name} · Company sheet"
  - es: 'Ficha de empresa · análisis a (?P<d>\d\d/\d\d/\d{4})'
    en: "Company sheet · analysis as of {d}"
  - es: '(?P<id>[A-Z0-9.]+) · (?P<sector>[^·]+) · (?P<industry>[^·]+) · (?P<country>[A-Z]{2}) · divisa de reporte (?P<cur>[A-Z]{3}) · LEI (?P<lei>[A-Z0-9]+)'
    en: "{id} · {sector} · {industry} · {country} · reporting currency {cur} · LEI {lei}"
  - es: '(?P<id>[A-Z0-9.]+) · (?P<sector>[^·]+) · (?P<industry>[^·]+) · (?P<country>[A-Z]{2}) · divisa de reporte (?P<cur>[A-Z]{3})'
    en: "{id} · {sector} · {industry} · {country} · reporting currency {cur}"
  - es: 'Acción: (?P<listing>.+) · Cotización: (?P<price>.+)'
    en: "Share: {listing} · Price: {price}"
  - es: '(?P<p>\d[\d.,]*) (?P<c>[A-Z]{3}) del (?P<d>\d\d/\d\d/\d{4})'
    en: "{p} {c} on {d}"
  - es: 'Cobertura (?P<c>\d[\d.,]* %) · (?P<reason>.+)'
    en: "Coverage {c} · {reason}"
  - es: 'Cobertura (?P<c>\d[\d.,]* %)'
    en: "Coverage {c}"
  - es: 'Filtros que cumple: (?P<a>\d+) de (?P<b>\d+)'
    en: "Screens passed: {a} of {b}"
  # Línea de fórmula: «<nombre>: <fórmula>» (el nombre va en negrita, en otro nodo).
  - es: ': (?P<f>.+)'
    en: ": {f}"
  # Comparación de un bono con su tramo de rating.
  - es: '(?P<v>[+−-]?\d[\d.,]*) pb \(mediana del tramo: (?P<m>\d[\d.,]*) pb\)'
    en: "{v} bp (bucket median: {m} bp)"
  - es: '(?P<r>[A-D][A-Da-c0-9+-]*) \((?P<agency>[^()]+)\)'
    en: "{r} ({agency})"

  # === Motivos de una puntuación que no se muestra (scoring/scores.py) =============================
  - es: '(?P<detail>.+) \(factor obligatorio: (?P<metric>[^()]+)\)'
    en: "{detail} (required factor: {metric})"
  - es: 'Cobertura del (?P<c>\d[\d.,]*) %, inferior al mínimo del (?P<m>\d[\d.,]*) %'
    en: "Coverage of {c} %, below the minimum of {m} %"
  - es: 'Solo (?P<n>\d+) factor con dato \(mínimo (?P<m>\d+)\)'
    en: "Only {n} factor with data (minimum {m})"
  - es: 'Solo (?P<n>\d+) factores con dato \(mínimo (?P<m>\d+)\)'
    en: "Only {n} factors with data (minimum {m})"
  - es: 'solo (?P<n>\d+) factor con dato \(mínimo (?P<m>\d+)\)'
    en: "only {n} factor with data (minimum {m})"
  - es: 'solo (?P<n>\d+) factores con dato \(mínimo (?P<m>\d+)\)'
    en: "only {n} factors with data (minimum {m})"
  - es: 'solo (?P<n>\d+) empresas con dato \(mínimo (?P<m>\d+)\)'
    en: "only {n} companies with data (minimum {m})"

  # === Alertas (screening/alerts.py) ===============================================================
  - es: 'Deuda neta/EBITDA de (?P<v>[+−-]?\d[\d.,]*)x, por encima del umbral de (?P<t>\d[\d.,]*)x'
    en: "Net debt/EBITDA of {v}x, above the {t}x threshold"
  - es: 'EBITDA negativo \((?P<e>[^)]+)\) con deuda neta positiva \((?P<d>[^)]+)\): apalancamiento por encima de cualquier umbral'
    en: "Negative EBITDA ({e}) with positive net debt ({d}): leverage above any threshold"
  - es: 'EBITDA nulo \((?P<e>[^)]+)\) con deuda neta positiva \((?P<d>[^)]+)\): apalancamiento por encima de cualquier umbral'
    en: "Zero EBITDA ({e}) with positive net debt ({d}): leverage above any threshold"
  - es: 'Rebaja de rating del bono (?P<isin>\S+): de (?P<a>\S+) a (?P<b>\S+) \((?P<agency>.+), (?P<d>\d\d/\d\d/\d{4})\); pasa de grado de inversión a high yield'
    en: "Rating downgrade of bond {isin}: from {a} to {b} ({agency}, {d}); it falls from investment grade to high yield"
  - es: 'Rebaja de rating del bono (?P<isin>\S+): de (?P<a>\S+) a (?P<b>\S+) \((?P<agency>.+), (?P<d>\d\d/\d\d/\d{4})\)'
    en: "Rating downgrade of bond {isin}: from {a} to {b} ({agency}, {d})"
  - es: 'Puntuación de (?P<type>renta variable|crédito): de (?P<a>\d+) a (?P<b>\d+) \((?P<chg>[+−-]?\d+) puntos\) desde la ejecución a (?P<d>\d\d/\d\d/\d{4})(?P<rest>\..*)?'
    en: "{type} score: from {a} to {b} ({chg} points) since the run as of {d}{rest}"
  - es: '\. Factores que más lo explican: (?P<drivers>.+?)(?P<warn>\. Atención: la configuración ha cambiado entre ambas ejecuciones)?'
    en: ". Main drivers: {drivers}{warn}"
  - es: '(?P<m1>[^(]+) \((?P<d1>[+−-]?\d[\d.,]*) puntos\), (?P<m2>[^(]+) \((?P<d2>[+−-]?\d[\d.,]*) puntos\)'
    en: "{m1} ({d1} points), {m2} ({d2} points)"
  - es: '(?P<m1>[^(]+) \((?P<d1>[+−-]?\d[\d.,]*) puntos\)'
    en: "{m1} ({d1} points)"
  # Alerta precedida de su regla (estudio y resumen de la portada).
  - es: '· (?P<rule>Apalancamiento elevado|Cambio de puntuación|Rebaja de rating): (?P<msg>.+)'
    en: "· {rule}: {msg}"
  - es: '· (?P<rule>Apalancamiento elevado|Cambio de puntuación|Rebaja de rating)'
    en: "· {rule}"

  # === Filtros (screening/screens.py) ==============================================================
  - es: '(?P<metric>[^:<>≤≥]+) (?P<op>[<>≤≥]) (?P<thr>[+−-]?\d[\d.,]*(?: ?(?:x|%|pb|M EUR))?)'
    en: "{metric} {op} {thr}"
  - es: '(?P<cond>[^:<>≤≥]+ [<>≤≥] [+−-]?\d[\d.,]*(?: ?(?:x|%|pb|M EUR))?): valor: (?P<v>.+)'
    en: "{cond}: value: {v}"
  - es: '(?P<cond>[^:<>≤≥]+ [<>≤≥] [+−-]?\d[\d.,]*(?: ?(?:x|%|pb|M EUR))?): (?P<status>Sin dato|No aplica|División por cero|No significativo|Dato desactualizado|Sin comparables suficientes): (?P<detail>.+)'
    en: "{cond}: {status}: {detail}"
  - es: '(?P<cond>[^:<>≤≥]+ [<>≤≥] [+−-]?\d[\d.,]*(?: ?(?:x|%|pb|M EUR))?): (?P<status>Sin dato|No aplica|División por cero|No significativo|Dato desactualizado|Sin comparables suficientes)'
    en: "{cond}: {status}"
  - es: '(?P<kind>Sector|País): (?P<allowed>[^:]+): valor: (?P<v>.+)'
    en: "{kind}: {allowed}: value: {v}"

  # === Estudio con datos reales (reports/study.py, providers/public) ===============================
  - es: 'Estudio con datos reales · (?P<d>\d\d/\d\d/\d{4})'
    en: "Real-data study · {d}"
  - es: 'Análisis a (?P<d>\d\d/\d\d/\d{4})(?P<cmp>, comparado con el \d\d/\d\d/\d{4})? · (?P<n>\d+) empresas · metodología (?P<ver>\S+) · datos descargados el (?P<dd>\d{4}-\d\d-\d\d) a las (?P<t>\d\d:\d\d) UTC'
    en: "Analysis as of {d}{cmp} · {n} companies · methodology {ver} · data downloaded on {dd} at {t} UTC"
  - es: 'Análisis a (?P<d>\d\d/\d\d/\d{4})(?P<cmp>, comparado con el \d\d/\d\d/\d{4})? · (?P<n>\d+) empresas · metodología (?P<ver>\S+)'
    en: "Analysis as of {d}{cmp} · {n} companies · methodology {ver}"
  # Descripción del universo: su primera frase y las fuentes que usa la web.
  - es: '(?P<first>.+)\. Cuentas de la SEC \(normas contables de EE\. UU\., sin ajustes\) y tipos de cambio del BCE, sin cotizaciones\.'
    en: "{first}. SEC filings (US accounting standards, without adjustments) and ECB exchange rates, without share prices."
  - es: 'Últimos doce meses hasta el último informe publicado antes del (?P<d>\d\d/\d\d/\d{4}) \(la columna «Cifras» dice cuál\)\. Las puntuaciones comparan cada empresa con las otras nueve: 100 es la mejor del grupo en cada factor\.'
    en: "Last twelve months up to the latest report published before {d} (the “Figures” column says which). The scores compare each company with the other nine: 100 is the best in the group on each factor."
  - es: 'Últimos doce meses hasta el último informe publicado antes del (?P<d>\d\d/\d\d/\d{4}) \(la columna «Cifras» dice cuál\)\. Las puntuaciones comparan cada empresa con las de su sector que tienen dato \(con todas, si son menos de (?P<n>\d+)\): 100 es la mejor del grupo en cada factor\.'
    en: "Last twelve months up to the latest report published before {d} (the “Figures” column says which). The scores compare each company with the companies in its sector that have data (with all of them, if there are fewer than {n}): 100 is the best in the group on each factor."
  - es: '(?P<n>\d+) avisos'
    en: "{n} warnings"
  # Gráfico: título accesible, ejes y cada punto.
  - es: '(?P<x>[^·:]+) frente a (?P<y>[^·:]+)'
    en: "{x} versus {y}"
  - es: '(?P<label>[^→]+) →'
    en: "{label} →"
  - es: '(?P<name>.+): (?P<x>[+−-]?\d[\d.,]* ?(?:%|x)) · (?P<y>[+−-]?\d[\d.,]* ?(?:%|x))'
    en: "{name}: {x} · {y}"
  - es: 'Fuera del gráfico: (?P<list>.+)\. Sus cifras están en la tabla y en sus avisos\.'
    en: "Left out of the chart: {list}. Their figures are in the table and in their warnings."
  - es: '(?P<id>[A-Z][A-Z0-9.]*) \((?P<why>sin uno de los dos datos o con EBITDA negativo|EBITDA distorsionado por una partida no recurrente)\)'
    en: "{id} ({why})"
  - es: 'Qué ha cambiado desde el (?P<d>\d\d/\d\d/\d{4})'
    en: "What has changed since {d}"
  - es: 'Las dos ejecuciones usan los mismos datos descargados, pero cada una solo ve lo que se había publicado en su fecha\. Por eso la del (?P<d>\d\d/\d\d/\d{4}) trabaja con informes anteriores\.'
    en: "Both runs use the same downloaded data, but each one only sees what had been published by its date. That is why the run as of {d} works with earlier reports."
  - es: 'Cifras usadas el (?P<d>\d\d/\d\d/\d{4})'
    en: "Figures used on {d}"
  - es: 'Alertas a (?P<d>\d\d/\d\d/\d{4})'
    en: "Alerts as of {d}"
  - es: 'Último informe registrado: (?P<form>\S+) del periodo cerrado el (?P<e>\d\d/\d\d/\d{4}), presentado el (?P<f>\d\d/\d\d/\d{4})\. Último periodo en los datos estructurados: (?P<p>\S+)\.'
    en: "Latest filing on record: {form} for the period ended {e}, filed on {f}. Latest period in the structured data: {p}."
  - es: 'Último periodo en los datos estructurados: (?P<p>\S+)\.'
    en: "Latest period in the structured data: {p}."
  - es: '(?P<c>[A-Z]{3})/EUR del BCE: (?P<n>\d+) días, del (?P<a>\d\d/\d\d/\d{4}) al (?P<b>\d\d/\d\d/\d{4})\.'
    en: "ECB {c}/EUR: {n} days, from {a} to {b}."
  - es: 'Las (?P<n>\d+) descargas de esta carga'
    en: "The {n} downloads of this load"
  - es: 'https://data\.sec\.gov/api/xbrl/companyfacts/(?P<cik>CIK\d+)\.json'
    en: "https://data.sec.gov/api/xbrl/companyfacts/{cik}.json"
  - es: 'https://data\.sec\.gov/submissions/(?P<cik>CIK\d+)\.json'
    en: "https://data.sec.gov/submissions/{cik}.json"
  - es: 'https://data-api\.ecb\.europa\.eu/service/data/EXR/D\.(?P<c>[A-Z]{3})\.EUR\.SP00\.A\?startPeriod=(?P<d>\d{4}-\d\d-\d\d)&format=csvdata'
    en: "https://data-api.ecb.europa.eu/service/data/EXR/D.{c}.EUR.SP00.A?startPeriod={d}&format=csvdata"
  # Avisos de calidad (providers/public/provider.py).
  - es: 'El último informe registrado \((?P<form>\S+) del periodo cerrado el (?P<e>\d\d/\d\d/\d{4}), presentado el (?P<f>\d\d/\d\d/\d{4})\) todavía no está en los datos estructurados de la SEC: se usan las cifras del (?P<d>\d\d/\d\d/\d{4})\.'
    en: "The latest filing on record ({form} for the period ended {e}, filed on {f}) is not yet in the SEC structured data: the figures as of {d} are used."
  - es: '(?P<item>Ventas|EBITDA|EBIT|Gastos financieros|Beneficio neto atribuible|Flujo de caja operativo|Inversiones \(capex\)|Deuda financiera|Caja y equivalentes|Patrimonio neto total|Patrimonio neto atribuible|Acciones en circulación \(millones\)): el último dato es del (?P<a>\d\d/\d\d/\d{4}), anterior al último periodo publicado \((?P<b>\d\d/\d\d/\d{4})\)\.'
    en: "{item}: the latest figure is from {a}, before the latest period published ({b})."
  - es: '(?P<item>Ventas|EBITDA|EBIT|Gastos financieros|Beneficio neto atribuible|Flujo de caja operativo|Inversiones \(capex\)|Deuda financiera|Caja y equivalentes|Patrimonio neto total|Patrimonio neto atribuible|Acciones en circulación \(millones\)): (?P<note>[^.]+)\.'
    en: "{item}: {note}."
  - es: 'Deuda a (?P<d>\d\d/\d\d/\d{4}): (?P<lines>.+) no aparece en ese balance y cuenta como cero\.'
    en: "Debt at {d}: {lines} does not appear on that balance sheet and counts as zero."
  - es: 'Resultado operativo atípico en el trimestre cerrado el (?P<d>\d\d/\d\d/\d{4}), dentro de los doce meses que usa el análisis: (?P<v>[+−-]?\d[\d.,]*) M (?P<c>[A-Z]{3}) frente a (?P<u>[+−-]?\d[\d.,]*) M de un trimestre típico de los dos últimos años\. Probable partida no recurrente \(un deterioro, la venta de un negocio…\): el EBITDA contable de los doce meses que incluyen ese trimestre la recoge entera\.'
    en: "Unusual operating income in the quarter ended {d}, within the twelve months the analysis uses: {v} M {c} versus {u} M in a typical quarter of the last two years. Probably a non-recurring item (an impairment, the sale of a business…): the reported EBITDA of the twelve months that include that quarter takes it in full."

  # === Motivos de un dato que no está (figures.py, normalization/, metrics/) =======================
  # «Estado: motivo», p. ej. «Sin dato: el bono no tiene rating».
  - es: '(?P<status>Sin dato|No aplica|División por cero|No significativo|Dato desactualizado|Sin comparables suficientes): (?P<detail>.+)'
    en: "{status}: {detail}"
  # «Etiqueta de la cifra: motivo», p. ej. «Gastos financieros LTM: falta …».
  - es: '(?P<label>(?:Ventas|EBITDA|EBIT|Gastos financieros|Beneficio neto atribuible|Flujo de caja operativo|Inversiones \(capex\))(?: LTM(?: del año anterior)?)?|Deuda financiera|Caja y equivalentes|Patrimonio neto total|Patrimonio neto atribuible|Acciones en circulación \(millones\)|Cotización|Capitalización \([A-Z]{3}\)|Tipo de cambio(?: medio)? [A-Z]{3}/[A-Z]{3}|Tipo de cambio medio|Tipo de cambio de cierre|Diferencial \(pb\)): (?P<detail>.+)'
    en: "{label}: {detail}"
  - es: 'falta «(?P<item>[^»]+)» de (?P<periods>.+)'
    en: "missing “{item}” for {periods}"
  - es: '(?P<label>.+) es cero'
    en: "{label} is zero"
  - es: '(?P<label>.+) es negativo \((?P<v>[^)]+)\)'
    en: "{label} is negative ({v})"
  - es: 'los últimos estados financieros son del (?P<ref>.+) \((?P<n>\d+) días antes de la fecha de análisis; máximo (?P<m>\d+)\)'
    en: "the latest financial statements are for {ref} ({n} days before the analysis date; maximum {m})"
  - es: 'la última cotización es del (?P<d>\d\d/\d\d/\d{4}) \((?P<n>\d+) días antes de la fecha de análisis; máximo (?P<m>\d+)\)'
    en: "the latest share price is from {d} ({n} days before the analysis date; maximum {m})"
  - es: 'la última cotización es del (?P<d>\d\d/\d\d/\d{4}) \((?P<n>\d+) días; máximo (?P<m>\d+)\)'
    en: "the latest quote is from {d} ({n} days; maximum {m})"
  - es: 'sin tipo de cambio entre el (?P<a>\d\d/\d\d/\d{4}) y el (?P<b>\d\d/\d\d/\d{4})'
    en: "no exchange rate between {a} and {b}"
  - es: 'sin tipos de cambio del (?P<a>\d\d/\d\d/\d{4}) al (?P<b>\d\d/\d\d/\d{4})'
    en: "no exchange rates from {a} to {b}"
  - es: 'el valor de empresa es negativo o nulo \((?P<v>[^)]+)\): la caja neta supera la capitalización'
    en: "enterprise value is negative or zero ({v}): net cash exceeds market capitalisation"
  - es: 'el capital invertido es negativo \((?P<v>[^)]+)\): la caja neta supera el patrimonio'
    en: "invested capital is negative ({v}): net cash exceeds equity"
  - es: 'solo (?P<n>\d+) bono\(s\) en el tramo (?P<b>.+) \(mínimo (?P<m>\d+)\)'
    en: "only {n} bond(s) in the {b} bucket (minimum {m})"
  # Diferencial de una empresa sin ningún bono utilizable: «ISIN: motivo; ISIN: motivo» (la lista
  # la parten los patrones genéricos del final; aquí, un solo bono).
  - es: '(?P<isin>[A-Z]{2}[A-Z0-9]{9}\d): (?P<detail>(?:[^;()]|\([^()]*\))+)'
    en: "{isin}: {detail}"

  # === Listas y sumas (genéricos: siempre al final) ================================================
  # Elementos separados por «; » (motivos, empresas fuera del gráfico…), sin partir paréntesis.
  - es: '(?P<a>(?:[^;()]|\([^()]*\))+); (?P<b>(?:[^;()]|\([^()]*\))+); (?P<c>(?:[^;()]|\([^()]*\))+); (?P<d>(?:[^;()]|\([^()]*\))+); (?P<e>(?:[^;()]|\([^()]*\))+); (?P<f>(?:[^;()]|\([^()]*\))+)'
    en: "{a}; {b}; {c}; {d}; {e}; {f}"
  - es: '(?P<a>(?:[^;()]|\([^()]*\))+); (?P<b>(?:[^;()]|\([^()]*\))+); (?P<c>(?:[^;()]|\([^()]*\))+); (?P<d>(?:[^;()]|\([^()]*\))+); (?P<e>(?:[^;()]|\([^()]*\))+)'
    en: "{a}; {b}; {c}; {d}; {e}"
  - es: '(?P<a>(?:[^;()]|\([^()]*\))+); (?P<b>(?:[^;()]|\([^()]*\))+); (?P<c>(?:[^;()]|\([^()]*\))+); (?P<d>(?:[^;()]|\([^()]*\))+)'
    en: "{a}; {b}; {c}; {d}"
  - es: '(?P<a>(?:[^;()]|\([^()]*\))+); (?P<b>(?:[^;()]|\([^()]*\))+); (?P<c>(?:[^;()]|\([^()]*\))+)'
    en: "{a}; {b}; {c}"
  - es: '(?P<a>(?:[^;()]|\([^()]*\))+); (?P<b>(?:[^;()]|\([^()]*\))+)'
    en: "{a}; {b}"
  # Sumas y restas de etiquetas XBRL o de líneas de deuda («A + B + C», «A − B», «−A»).
  - es: '(?P<a>[^+]+) \+ (?P<b>.+)'
    en: "{a} + {b}"
  - es: '(?P<a>[A-Z][A-Za-z]+) − (?P<b>[A-Z][A-Za-z]+)'
    en: "{a} − {b}"
  - es: '−(?P<a>[A-Z][A-Za-z]+)'
    en: "−{a}"
  # Listas con comas de nombres que empiezan en mayúscula (líneas de deuda, sectores de un filtro).
  - es: '(?P<a>[A-ZÁÉÍÓÚ][^,]*), (?P<b>[A-ZÁÉÍÓÚ].*)'
    en: "{a}, {b}"
