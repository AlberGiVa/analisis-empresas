  "Periodos.": "Periods."
  "Se usan los periodos acumulados desde el inicio del ejercicio (primer trimestre, semestre, nueve meses y año), identificados por sus fechas. Los doce últimos meses se calculan como año anterior + acumulado actual − mismo acumulado un año antes; funciona con cierres en mayo o junio y con años de 52/53 semanas.": "Cumulative periods from the start of the fiscal year are used (first quarter, half year, nine months and full year), identified by their dates. The last twelve months are calculated as previous year + current year-to-date − the same year-to-date a year earlier; this works with year-ends in May or June and with 52/53-week years."
  "Resultado operativo publicado más amortizaciones del estado de flujos. Incluye los deterioros y costes de reestructuración que la empresa haya registrado: puede ser bastante menor que el EBITDA «ajustado» que comunica.": "Reported operating income plus depreciation and amortisation from the cash flow statement. It includes any impairments and restructuring costs the company has booked: it can be well below the “adjusted” EBITDA the company announces."
  "Deuda.": "Debt."
