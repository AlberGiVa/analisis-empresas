  "Pagarés y otros préstamos a corto": "Notes and other short-term borrowings"
  "Pagarés y otros préstamos a largo": "Notes and other long-term borrowings"
  "Préstamos a corto y vencimientos a un año de la deuda a largo": "Short-term borrowings and current maturities of long-term debt"
  # Etiquetas XBRL de la SEC: se quedan igual.
  "Revenues": "Revenues"
  "RevenueFromContractWithCustomerExcludingAssessedTax": "RevenueFromContractWithCustomerExcludingAssessedTax"
  "RevenueFromContractWithCustomerIncludingAssessedTax": "RevenueFromContractWithCustomerIncludingAssessedTax"
  "SalesRevenueNet": "SalesRevenueNet"
  "OperatingIncomeLoss": "OperatingIncomeLoss"
  "InterestExpense": "InterestExpense"
  "InterestExpenseNonoperating": "InterestExpenseNonoperating"
  "InterestExpenseDebt": "InterestExpenseDebt"
  "InterestAndDebtExpense": "InterestAndDebtExpense"
  "InterestIncomeExpenseNonoperatingNet": "InterestIncomeExpenseNonoperatingNet"
  "NetIncomeLoss": "NetIncomeLoss"
  "NetCashProvidedByUsedInOperatingActivities": "NetCashProvidedByUsedInOperatingActivities"
  "NetCashProvidedByUsedInOperatingActivitiesContinuingOperations": "NetCashProvidedByUsedInOperatingActivitiesContinuingOperations"
  "PaymentsToAcquirePropertyPlantAndEquipment": "PaymentsToAcquirePropertyPlantAndEquipment"
  "PaymentsToAcquireProductiveAssets": "PaymentsToAcquireProductiveAssets"
  "CashAndCashEquivalentsAtCarryingValue": "CashAndCashEquivalentsAtCarryingValue"
  "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents": "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents"
  "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest": "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest"
  "StockholdersEquity": "StockholdersEquity"
  "MinorityInterest": "MinorityInterest"
  "CommonStockSharesOutstanding": "CommonStockSharesOutstanding"
  "EntityCommonStockSharesOutstanding": "EntityCommonStockSharesOutstanding"
  "DepreciationDepletionAndAmortization": "DepreciationDepletionAndAmortization"
  "DepreciationAmortizationAndAccretionNet": "DepreciationAmortizationAndAccretionNet"
  "DepreciationAndAmortization": "DepreciationAndAmortization"
  "Depreciation": "Depreciation"
  "AmortizationOfIntangibleAssets": "AmortizationOfIntangibleAssets"
  "NotesAndLoansPayable": "NotesAndLoansPayable"
  "ShortTermBorrowings": "ShortTermBorrowings"
  "ShortTermBankLoansAndNotesPayable": "ShortTermBankLoansAndNotesPayable"
  "CommercialPaper": "CommercialPaper"
  "DebtCurrent": "DebtCurrent"
  "LongTermDebtCurrent": "LongTermDebtCurrent"
  "LongTermDebtNoncurrent": "LongTermDebtNoncurrent"
  "LongTermDebtAndCapitalLeaseObligations": "LongTermDebtAndCapitalLeaseObligations"
  "LongTermDebtAndCapitalLeaseObligationsCurrent": "LongTermDebtAndCapitalLeaseObligationsCurrent"
  "LongTermNotesAndLoans": "LongTermNotesAndLoans"
  "LongTermNotesPayable": "LongTermNotesPayable"
  "NotesPayableCurrent": "NotesPayableCurrent"
