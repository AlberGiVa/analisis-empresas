  "Cifras tal como las publican las empresas en la SEC (normas contables de EE. UU., sin los ajustes que ellas mismas presentan como «ajustados») y tipos de cambio del BCE. Cada importe en euros usa el tipo de cambio de su fecha. No es una recomendación de inversión: describe y compara.": "Figures as the companies file them with the SEC (US accounting standards, without the adjustments they themselves present as “adjusted”) and ECB exchange rates. Each amount in euros uses the exchange rate of its date. This is not an investment recommendation: it describes and compares."
  "Esta versión va sin cotizaciones: las condiciones de los servicios gratuitos que las ofrecen no permiten republicarlas. Por eso no hay capitalización, PER, EV/EBITDA ni FCF yield, y la puntuación de accionista solo mide rentabilidad y crecimiento.": "This version has no share prices: the terms of the free services that offer them do not allow republishing them. That is why there is no market capitalisation, P/E, EV/EBITDA or FCF yield, and the shareholder score only measures profitability and growth."
  "La vista de acreedor usa solo fundamentales: no hay una fuente gratuita y fiable de diferenciales de bonos ni de ratings (ver «Método y límites»).": "The creditor view uses fundamentals only: there is no free, reliable source of bond spreads or ratings (see “Method and limits”)."
