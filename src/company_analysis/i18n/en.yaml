  "Calcula todas las métricas y las dos puntuaciones con todos sus factores.": "It calculates every metric and both scores with all their factors."
  "Cuando falta un dato": "When a figure is missing"
  "La herramienta nunca estima ni rellena un dato que falta: lo marca, dice por qué y puntúa con el resto de factores. Si faltan demasiados, no da puntuación.": "The tool never estimates or fills in a missing figure: it flags it, says why and scores with the remaining factors. If too many are missing, it gives no score."
  "Faltan las inversiones": "Capital expenditure is missing"
  "No ha publicado sus inversiones en inmovilizado (capex) de 2025.": "It has not published its 2025 capital expenditure (capex)."
  "Sin inversiones no hay flujo de caja libre: el FCF yield queda «sin dato» y la puntuación de accionista se calcula con los demás factores.": "Without capital expenditure there is no free cash flow: the FCF yield shows “no data” and the shareholder score is calculated with the other factors."
  "Faltan los gastos financieros": "Interest expense is missing"
  "No ha publicado sus gastos financieros de 2025.": "It has not published its 2025 interest expense."
  "La cobertura de intereses queda «sin dato» y la puntuación de acreedor se calcula con los demás factores.": "Interest coverage shows “no data” and the creditor score is calculated with the other factors."
  "Cotización desactualizada": "Stale share price"
  "Su última cotización tiene más de tres meses.": "Its last share price is more than three months old."
  "Las métricas que necesitan el precio quedan como «dato desactualizado»; las contables, como el ROE, se calculan igual. Le faltan demasiados factores para darle puntuación de accionista.": "The metrics that need the price are shown as “stale data”; the accounting ones, such as ROE, are calculated as usual. Too many factors are missing to give it a shareholder score."
  "Empresas con características especiales": "Companies with special features"
  "Situaciones normales en una cartera que obligan a tratar los datos de otra forma.": "Common situations in a portfolio that call for handling the data differently."
  "EBITDA negativo": "Negative EBITDA"
  "Tecnológica en pérdidas: su EBITDA y su beneficio de los últimos doce meses son negativos.": "A loss-making technology company: its EBITDA and its profit over the last twelve months are negative."
  "Un múltiplo sobre una cifra negativa no tiene sentido: el PER, el EV/EBITDA y la deuda neta/EBITDA salen «no significativo». Además, avisa del apalancamiento.": "A multiple of a negative figure makes no sense: the P/E, EV/EBITDA and net debt/EBITDA show “not meaningful”. It also warns about the leverage."
  "Empresa sin deuda": "Company without debt"
  "Tecnológica sin deuda financiera ni bonos.": "A technology company with no financial debt and no bonds."
  "Su deuda neta es negativa (tiene más caja que deuda) y no recibe puntuación de acreedor: no hay bonos que analizar.": "Its net debt is negative (it has more cash than debt) and it gets no creditor score: there are no bonds to analyse."
  "Cotiza en euros y publica en dólares": "Listed in euros, reports in dollars"
  "Cotiza en Ámsterdam en euros, pero sus cuentas están en dólares.": "It is listed in Amsterdam in euros, but its accounts are in dollars."
  "Pasa la capitalización a dólares con el tipo de cambio de la fecha de la cotización, para que el PER compare cifras en la misma moneda.": "It converts the market capitalisation into dollars at the exchange rate of the share price's date, so that the P/E compares figures in the same currency."
  "Ejercicio que cierra en marzo": "Fiscal year ending in March"
  "Su ejercicio va de abril a marzo.": "Its fiscal year runs from April to March."
  "Usa el último ejercicio publicado, cerrado en marzo de 2026, y lo compara con el año 2025 de las demás empresas.": "It uses the latest published fiscal year, ended in March 2026, and compares it with the other companies' 2025."
  "Banco": "Bank"
  "Un banco: su deuda son sobre todo depósitos y su negocio es prestar.": "A bank: its debt is mostly deposits and its business is lending."
  "Las métricas basadas en el EBITDA, la deuda neta o el valor de empresa «no aplican» y no cuentan en la puntuación; el PER y el ROE, sí.": "The metrics based on EBITDA, net debt or enterprise value are “not applicable” and do not count in the score; the P/E and ROE do."
  "Aseguradora": "Insurer"
  "Una aseguradora: invierte las primas que cobra para pagar los siniestros.": "An insurer: it invests the premiums it collects to pay claims."
  "Igual que en los bancos: esas métricas «no aplican» y se puntúa con las demás.": "As with banks: those metrics are “not applicable” and the score uses the others."
  "Bonos y rating": "Bonds and ratings"
  "Cómo sigue la herramienta los ratings y los diferenciales de los bonos.": "How the tool follows bond ratings and spreads."
  "Sus bonos bajaron de BBB- a BB+ el 12/03/2026: dejaron de ser grado de inversión.": "Its bonds were cut from BBB- to BB+ on 12/03/2026: they stopped being investment grade."
  "Lanza una alerta por cada bono y desde entonces los compara con los del tramo BB.": "It raises an alert for each bond and from then on compares them with those in the BB bucket."
  "Subida de rating": "Rating upgrade"
  "Sus bonos subieron de A- a A en 2024.": "Its bonds were upgraded from A- to A in 2024."
  "Una subida no genera alerta: solo cambia el tramo con el que se comparan.": "An upgrade does not trigger an alert: it only changes the bucket they are compared with."
  "Tramo de rating con pocos bonos": "Rating bucket with few bonds"
  "Uno de sus bonos es AA-, un tramo con muy pocos bonos en el ejemplo, y otro no tiene rating.": "One of its bonds is AA-, a bucket with very few bonds in the sample, and another has no rating."
  "No compara un diferencial con un grupo demasiado pequeño ni con un tramo que no existe: lo marca y usa solo el bono que sí se puede comparar.": "It does not compare a spread with a group that is too small or with a bucket that does not exist: it flags them and uses only the bond that can be compared."

