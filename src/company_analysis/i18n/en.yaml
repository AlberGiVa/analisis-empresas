  "Resultado operativo antes de amortizaciones: aproxima la caja que genera el negocio.": "Operating profit before depreciation and amortisation: it approximates the cash the business generates."
  "Deuda financiera menos caja y equivalentes.": "Financial debt minus cash and equivalents."
  "EV": "EV"
  "Valor de empresa (": "Short for "
  "enterprise value": "enterprise value"
  "): capitalización bursátil más deuda neta.": ": market capitalisation plus net debt."
  "Flujo de caja libre (": "Short for "
  "free cash flow": "free cash flow"
  "): flujo de caja operativo menos inversiones en inmovilizado.": ": operating cash flow minus capital expenditure on fixed assets."
  "Diferencial": "Spread"
  "Rentabilidad extra de un bono sobre la referencia sin riesgo, en puntos básicos (100 pb = 1 %).": "Extra yield of a bond over the risk-free benchmark, in basis points (100 bp = 1 %)."
  "Tramo de rating": "Rating bucket"
  "Grupo de calificaciones de la misma letra (A, BBB, BB…).": "Group of ratings with the same letter (A, BBB, BB…)."
  "Prelación": "Seniority"
  "Orden de cobro de un bono si la empresa no paga: garantizado, sénior, subordinado.": "Order in which a bond is repaid if the company defaults: secured, senior, subordinated."
  "Percentil": "Percentile"
  "Posición de un valor dentro de su grupo, de 0 a 100 (100 es el mejor).": "Position of a value within its group, from 0 to 100 (100 is the best)."
  "Parte del peso de los factores aplicables que tiene dato.": "Share of the weight of the applicable factors that has data."
  "Diccionario de métricas": "Metric dictionary"
  "Pulsa una métrica para ver qué mide, su fórmula y sus casos límite.": "Click a metric to see what it measures, its formula and its edge cases."
  "De dónde salen los datos": "Where the data come from"
  "Empresas reales:": "Real companies:"
  "cuentas presentadas en la SEC (EE. UU.), datos públicos de la administración estadounidense, con la fecha en que se presentó cada informe; y tipos de cambio del Banco Central Europeo, de reutilización libre citando la fuente. Se descargan de nuevo en cada actualización.": "accounts filed with the SEC (US), public data of the US government, with the date on which each report was filed; and European Central Bank exchange rates, free to reuse with attribution. They are downloaded again at every update."
  "Ejemplo:": "Example:"
  "datos inventados por un generador reproducible, con casos límite a propósito (EBITDA negativo, una empresa sin deuda, datos que faltan, otra divisa y una rebaja de rating).": "data made up by a reproducible generator, with deliberate edge cases (negative EBITDA, a company without debt, missing data, another currency and a rating downgrade)."
  "Lo que no se publica:": "What is not published:"
  "cotizaciones de servicios sin licencia, datos de proveedores de pago y el diario del analista.": "share prices from unlicensed services, data from paid providers and the analyst journal."
