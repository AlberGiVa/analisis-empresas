[project]
name = "company-analysis"
version = "0.1.0"
description = "Herramienta interna de análisis de empresas para un fondo multiactivos (vista de acción y de crédito)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=3.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "streamlit>=1.66",
    "typer>=0.27",
]

[project.scripts]
analisis = "company_analysis.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pandas-stubs>=3.0",
    "pytest>=9.1",
    "pytest-socket>=0.8",
    "ruff>=0.17",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Use the Python already installed on the computer (official, signed build); never download one.
python-preference = "only-system"
python-downloads = "never"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # timezone-naive datetimes
    "SIM",  # simplifications
    "PT",   # pytest style
    "RUF",  # ruff-specific rules
    "NPY",  # numpy
    "PERF", # performance anti-patterns
    "PL",   # pylint subset
    "T20",  # stray print statements
]
ignore = [
    "PLR0911", # many returns: metric functions return early for each edge case
    "PLR0913", # many arguments: domain functions legitimately take several inputs
    "PLR0917", # many positional arguments: same reason as PLR0913
    "PLR2004", # magic values: thresholds live in the YAML config; tests compare literals
]
# Typographic characters used in Spanish texts and formulas.
allowed-confusables = ["×", "−", "–", "’"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
# Stored timestamps are naive UTC by convention; tests build them directly.
"tests/*" = ["DTZ001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Tests never reach the internet: only loopback connections are allowed.
    "--allow-hosts=127.0.0.1,::1",
]
